<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>StudyEasy</title>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖥️</text></svg>">
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    /* ============================================================
   StudyEasy — Design Tokens (optimized for phone + dark/light)
   ============================================================ */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap');

    :root {
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
      --radius-xl: 26px;
      --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;

      --accent: #0A84FF;
      --accent-rgb: 10, 132, 255;
      --danger: #FF453A;
      --success: #32D74B;
      --warn: #FF9F0A;

      --c-blue: #0A84FF;
      --c-purple: #BF5AF2;
      --c-green: #32D74B;
      --c-orange: #FF9F0A;
      --c-red: #FF453A;
      --c-cyan: #64D2FF;
      --c-pink: #FF375F;
      --c-yellow: #FFD60A;

      --ease: cubic-bezier(.4, 0, .2, 1);
    }

    [data-theme="dark"] {
      --bg-wallpaper-1: #0b0b10;
      --bg-wallpaper-2: #15131f;
      --window-bg: rgba(28, 28, 32, 0.72);
      --panel-bg: rgba(255, 255, 255, 0.045);
      --panel-bg-solid: #1c1c20;
      --panel-border: rgba(255, 255, 255, 0.09);
      --panel-border-strong: rgba(255, 255, 255, 0.14);
      --sidebar-bg: rgba(20, 20, 24, 0.55);
      --text-primary: rgba(255, 255, 255, 0.94);
      --text-secondary: rgba(243, 215, 215, 0.56);
      --text-tertiary: rgba(255, 255, 255, 0.34);
      --field-bg: rgba(255, 255, 255, 0.06);
      --field-border: rgba(255, 255, 255, 0.10);
      --hover-bg: rgba(255, 255, 255, 0.06);
      --active-bg: rgba(var(--accent-rgb), 0.18);
      --shadow-window: 0 30px 90px -20px rgba(0, 0, 0, 0.65), 0 4px 24px rgba(0, 0, 0, 0.35);
      --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.2);
      --shadow-card-hover: 0 18px 40px -16px rgba(0, 0, 0, 0.55);
      --scrollbar: rgba(255, 255, 255, 0.15);
    }

    [data-theme="light"] {
      --bg-wallpaper-1: #dfe4ec;
      --bg-wallpaper-2: #eef1f6;
      --window-bg: rgba(246, 246, 248, 0.78);
      --panel-bg: rgba(255, 255, 255, 0.55);
      --panel-bg-solid: #ffffff;
      --panel-border: rgba(0, 0, 0, 0.07);
      --panel-border-strong: rgba(0, 0, 0, 0.12);
      --sidebar-bg: rgba(240, 240, 243, 0.6);
      --text-primary: rgba(20, 20, 25, 0.92);
      --text-secondary: rgba(20, 20, 25, 0.55);
      --text-tertiary: rgba(20, 20, 25, 0.36);
      --field-bg: rgba(0, 0, 0, 0.035);
      --field-border: rgba(0, 0, 0, 0.09);
      --hover-bg: rgba(0, 0, 0, 0.045);
      --active-bg: rgba(var(--accent-rgb), 0.12);
      --shadow-window: 0 30px 90px -24px rgba(20, 20, 40, 0.28), 0 4px 24px rgba(20, 20, 40, 0.08);
      --shadow-card: 0 1px 2px rgba(20, 20, 40, 0.05);
      --shadow-card-hover: 0 18px 40px -18px rgba(20, 20, 40, 0.22);
      --scrollbar: rgba(0, 0, 0, 0.15);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: var(--font-ui);
      color: var(--text-primary);
      background: linear-gradient(175deg, var(--bg-wallpaper-1), var(--bg-wallpaper-2));
      background-attachment: fixed;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    ::selection {
      background: rgba(var(--accent-rgb), 0.35);
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar);
      border-radius: 20px;
      background-clip: padding-box;
      border: 2px solid transparent;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    button {
      font-family: inherit;
    }

    input,
    textarea,
    select {
      font-family: inherit;
    }

    /* ---------- Auth Overlay ---------- */
    #auth-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: linear-gradient(175deg, var(--bg-wallpaper-1), var(--bg-wallpaper-2));
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: opacity 0.4s var(--ease);
    }

    .auth-card {
      background: var(--window-bg);
      border: 1px solid var(--panel-border-strong);
      border-radius: var(--radius-xl);
      padding: 40px 30px;
      text-align: center;
      box-shadow: var(--shadow-window);
      max-width: 360px;
      width: 90%;
    }

    .auth-card h1 {
      font-size: 24px;
      font-weight: 800;
      margin: 0 0 10px;
      letter-spacing: -0.02em;
    }

    .auth-card p {
      color: var(--text-secondary);
      font-size: 13.5px;
      margin: 0 0 24px;
      line-height: 1.5;
    }

    /* ---------- App window shell ---------- */
    #app-window {
      position: absolute;
      inset: 22px;
      border-radius: var(--radius-xl);
      background: var(--window-bg);
      backdrop-filter: blur(40px) saturate(160%);
      -webkit-backdrop-filter: blur(40px) saturate(160%);
      border: 1px solid var(--panel-border);
      box-shadow: var(--shadow-window);
      display: none;
      /* Hidden initially, shown after auth */
      flex-direction: column;
      overflow: hidden;
    }

    @media (max-width: 860px) {
      #app-window {
        inset: 0;
        border-radius: 0;
      }
    }

    /* ---------- Top bar ---------- */
    #topbar {
      height: 52px;
      min-height: 52px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 0 12px;
      border-bottom: 1px solid var(--panel-border);
      -webkit-app-region: drag;
      flex-wrap: nowrap;
    }

    .traffic {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-shrink: 0;
    }

    .traffic span {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      display: inline-block;
      box-shadow: inset 0 0 0 0.5px rgba(0, 0, 0, 0.15);
    }

    .traffic .red {
      background: #FF5F57;
    }

    .traffic .yellow {
      background: #FEBC2E;
    }

    .traffic .green {
      background: #28C840;
    }

    #topbar .app-title {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
      font-size: 13px;
      color: var(--text-secondary);
      white-space: nowrap;
    }

    #topbar .app-title b {
      color: var(--text-primary);
      font-weight: 700;
      letter-spacing: 0.2px;
    }

    #topbar .search-trigger {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--field-bg);
      border: 1px solid var(--field-border);
      padding: 5px 9px;
      border-radius: 9px;
      color: var(--text-tertiary);
      font-size: 12px;
      cursor: pointer;
      transition: all .15s var(--ease);
      min-width: 40px;
      flex-shrink: 1;
      overflow: hidden;
    }

    #topbar .search-trigger:hover {
      border-color: var(--panel-border-strong);
      color: var(--text-secondary);
    }

    #topbar .search-trigger .kbd {
      font-family: var(--font-mono);
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(120, 120, 140, 0.18);
      color: var(--text-tertiary);
      margin-left: auto;
      flex-shrink: 0;
    }

    #topbar .search-trigger span:not(.kbd) {
      display: none;
    }

    @media (min-width: 500px) {
      #topbar .search-trigger span:not(.kbd) {
        display: inline;
      }

      #topbar .search-trigger {
        min-width: 160px;
      }
    }

    @media (max-width: 420px) {
      #topbar .app-title span {
        display: none;
      }

      #topbar {
        padding: 0 8px;
        gap: 6px;
      }

      .traffic span {
        width: 9px;
        height: 9px;
      }
    }

    /* ---------- Google account widget ---------- */
    #google-account {
      position: relative;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
      margin-left: 4px;
    }

    .ga-user {
      display: flex;
      align-items: center;
      gap: 4px;
      cursor: pointer;
      padding: 2px 6px 2px 2px;
      border-radius: 20px;
      border: 1px solid transparent;
      transition: all .15s var(--ease);
    }

    .ga-user:hover {
      background: var(--hover-bg);
      border-color: var(--field-border);
    }

    .ga-avatar {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      object-fit: cover;
      background: var(--field-bg);
      display: block;
    }

    .ga-name {
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-primary);
      max-width: 80px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .ga-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      width: 220px;
      background: var(--panel-bg-solid);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-card-hover);
      padding: 6px;
      display: none;
      z-index: 80;
      -webkit-app-region: no-drag;
    }

    .ga-menu.open {
      display: block;
    }

    .ga-menu-head {
      padding: 6px 10px 10px;
      border-bottom: 1px solid var(--panel-border);
      margin-bottom: 6px;
    }

    .ga-menu-name {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-primary);
    }

    .ga-menu-email {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 2px;
    }

    .ga-menu-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      color: var(--text-secondary);
      cursor: pointer;
    }

    .ga-menu-item:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .ga-menu-danger {
      color: var(--danger);
    }

    .ga-menu-danger:hover {
      background: rgba(255, 69, 58, 0.12);
      color: var(--danger);
    }

    .ga-menu-sub {
      font-size: 10.5px;
      color: var(--text-tertiary);
      padding: 0 10px 8px;
    }

    .ga-menu-sub-warn {
      color: var(--warn);
    }

    .ga-menu-warn {
      color: var(--warn);
    }

    .ga-menu-warn:hover {
      background: rgba(255, 159, 10, 0.12);
      color: var(--warn);
    }

    .ga-status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .ga-dot-ok {
      background: var(--success);
    }

    .ga-dot-busy {
      background: var(--accent);
      animation: ga-pulse 1s ease-in-out infinite;
    }

    .ga-dot-warn {
      background: var(--warn);
    }

    @keyframes ga-pulse {

      0%,
      100% {
        opacity: 1;
      }

      50% {
        opacity: .35;
      }
    }

    @media (max-width: 480px) {
      .ga-name {
        display: none;
      }
    }

    /* ---------- Body layout ---------- */
    #body-row {
      flex: 1;
      display: flex;
      min-height: 0;
    }

    #sidebar {
      width: 200px;
      min-width: 200px;
      background: var(--sidebar-bg);
      border-right: 1px solid var(--panel-border);
      display: flex;
      flex-direction: column;
      padding: 12px 8px;
      transition: width .2s var(--ease), min-width .2s var(--ease);
      overflow-y: auto;
    }

    #sidebar.compact {
      width: 60px;
      min-width: 60px;
    }

    .sb-section-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-tertiary);
      padding: 8px 8px 4px;
      font-weight: 700;
    }

    .sb-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 9px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      transition: background .12s var(--ease), color .12s var(--ease);
      white-space: nowrap;
      overflow: hidden;
    }

    .sb-item svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .sb-item:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .sb-item.active {
      background: var(--active-bg);
      color: var(--accent);
    }

    #sidebar.compact .sb-item span.label,
    #sidebar.compact .sb-section-label {
      display: none;
    }

    #sidebar.compact .sb-item {
      justify-content: center;
    }

    #sidebar-bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 8px;
      border-top: 1px solid var(--panel-border);
    }

    .status-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-tertiary);
      padding: 2px 8px;
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
    }

    .theme-switch {
      display: flex;
      gap: 3px;
      padding: 2px;
      background: var(--field-bg);
      border-radius: 9px;
      border: 1px solid var(--field-border);
      margin: 0 4px;
    }

    .theme-switch button {
      flex: 1;
      border: none;
      background: transparent;
      padding: 5px 0;
      border-radius: 7px;
      cursor: pointer;
      color: var(--text-tertiary);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .theme-switch button.active {
      background: var(--panel-bg-solid);
      color: var(--text-primary);
      box-shadow: var(--shadow-card);
    }

    .theme-switch svg {
      width: 13px;
      height: 13px;
    }

    #main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      position: relative;
      scroll-behavior: smooth;
    }

    #view {
      padding: 20px 18px 60px;
      max-width: 1200px;
      margin: 0 auto;
    }

    #view.fade-in {
      animation: viewFade .35s var(--ease);
    }

    @keyframes viewFade {
      from {
        opacity: 0;
        transform: translateY(6px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 860px) {
      #view {
        padding: 14px 12px 100px;
      }
    }

    @media (max-width: 420px) {
      #view {
        padding: 10px 8px 100px;
      }
    }

    /* ---------- Typography ---------- */
    h1.page-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0 0 2px;
    }

    @media (max-width: 480px) {
      h1.page-title {
        font-size: 19px;
      }
    }

    p.page-sub {
      color: var(--text-secondary);
      font-size: 13px;
      margin: 0 0 20px;
    }

    .eyebrow {
      font-size: 10.5px;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--text-tertiary);
      font-weight: 700;
    }

    /* ---------- Cards / Panels ---------- */
    .panel {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      transition: box-shadow .2s var(--ease), transform .2s var(--ease), border-color .2s var(--ease);
    }

    .stat-card {
      padding: 14px 16px;
    }

    .stat-card .num {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-top: 2px;
    }

    .stat-card .lbl {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .stat-card .icon-wrap {
      width: 30px;
      height: 30px;
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 8px;
    }

    .stat-card .icon-wrap svg {
      width: 15px;
      height: 15px;
    }

    .grid-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      margin-bottom: 20px;
    }

    @media (max-width:600px) {
      .grid-stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
      }

      .stat-card {
        padding: 12px 12px;
      }

      .stat-card .num {
        font-size: 22px;
      }
    }

    .dash-grid {
      display: grid;
      grid-template-columns: 1.3fr 1fr;
      gap: 14px;
    }

    @media (max-width:820px) {
      .dash-grid {
        grid-template-columns: 1fr !important;
      }
    }

    .progress-track {
      height: 6px;
      border-radius: 20px;
      background: var(--field-bg);
      overflow: hidden;
      border: 1px solid var(--field-border);
    }

    .progress-fill {
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(90deg, var(--accent), #64D2FF);
      transition: width .5s var(--ease);
    }

    .module-card {
      padding: 14px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .module-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--panel-border-strong);
    }

    .module-card .icon-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
    }

    .module-card .icon-badge svg {
      width: 17px;
      height: 17px;
    }

    .module-card h3 {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 2px;
      letter-spacing: -0.01em;
    }

    .module-card p.desc {
      font-size: 12px;
      color: var(--text-secondary);
      margin: 0 0 10px;
      line-height: 1.4;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .module-card .meta-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 11px;
      color: var(--text-tertiary);
    }

    .pill {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 20px;
      letter-spacing: 0.02em;
    }

    .module-actions {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 3px;
      opacity: 0;
      transition: opacity .15s var(--ease);
    }

    .module-card:hover .module-actions {
      opacity: 1;
    }

    /* On touch devices, always show module actions */
    @media (hover: none) {
      .module-actions {
        opacity: 1;
      }
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg-solid);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-secondary);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .icon-btn:hover {
      color: var(--text-primary);
      background: var(--hover-bg);
    }

    .icon-btn svg {
      width: 13px;
      height: 13px;
    }

    @media (max-width: 860px) {
      .icon-btn {
        width: 32px;
        height: 32px;
      }
    }

    .modules-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 12px;
    }

    /* ---------- "On fire" state ---------- */
    .module-card.on-fire {
      border-color: rgba(255, 120, 20, 0.35);
      animation: fireBorder 2.4s ease-in-out infinite;
    }

    .module-card.on-fire .glow {
      background: radial-gradient(circle, rgba(255, 159, 10, 0.9), rgba(255, 69, 58, 0.5) 60%, transparent 75%) !important;
      opacity: 0.28;
      animation: fireGlowPulse 2.1s ease-in-out infinite;
    }

    .module-card.on-fire:hover .glow {
      opacity: 0.55;
    }

    .fire-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(160deg, rgba(255, 159, 10, 0.22), rgba(255, 69, 58, 0.22));
      border: 1px solid rgba(255, 140, 20, 0.4);
      animation: fireFlicker 1.6s ease-in-out infinite;
      z-index: 2;
      pointer-events: none;
    }

    .module-card.on-fire:hover .fire-badge {
      opacity: 0;
    }

    .fire-badge svg {
      width: 11px;
      height: 11px;
      color: #FF9F0A;
      filter: drop-shadow(0 0 4px rgba(255, 120, 10, 0.8));
    }

    @keyframes fireBorder {

      0%,
      100% {
        box-shadow: var(--shadow-card), 0 0 0 0 rgba(255, 110, 10, 0.0);
      }

      50% {
        box-shadow: var(--shadow-card), 0 0 18px 1px rgba(255, 110, 10, 0.28);
      }
    }

    @keyframes fireGlowPulse {

      0%,
      100% {
        transform: scale(1) translateY(0);
        opacity: 0.24;
      }

      50% {
        transform: scale(1.18) translateY(-4px);
        opacity: 0.42;
      }
    }

    @keyframes fireFlicker {

      0%,
      100% {
        transform: scale(1) rotate(0deg);
        filter: brightness(1);
      }

      25% {
        transform: scale(1.08) rotate(-3deg);
        filter: brightness(1.15);
      }

      50% {
        transform: scale(0.96) rotate(2deg);
        filter: brightness(0.95);
      }

      75% {
        transform: scale(1.05) rotate(-1deg);
        filter: brightness(1.1);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .module-card.on-fire,
      .module-card.on-fire .glow,
      .fire-badge {
        animation: none;
      }
    }

    /* ---------- Buttons ---------- */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12.5px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 9px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all .15s var(--ease);
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

        min-height: 40px;
        padding: 8px 14px;
      }

        min-height: 34px;

      }

    .btn svg {

      height: 14px;
    }

    .btn-primary {

    .btn-secondary {

      border-color: rgba(255, 69, 58, 0.25);
    }

    .btn-danger:hover {
      background: rgba(255, 69, 58, 0.2);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
    }

    .btn-ghost:hover {
      background: var(--hover-bg);
      color: var(--text-primary);
    }

    .btn-sm {
      padding: 4px 10px;
      font-size: 11.5px;
    }

    .btn:disabled {

    .btn-big-dashed {

    /* ---------- Forms ---------- */
    .field-label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-secondary);
      margin-bottom: 5px;
      display: block;
    }

    .field {
      width: 100%;

      color: var(--text-primary);

      -webkit-appearance: none;

    }

    .field:focus {

    .color-swatches {

    .swatch {

    .icon-picker {

    .icon-pick-btn {

    .icon-pick-btn.selected {

    .seg-control {

    /* ---------- YouTube resource viewer ---------- */

    .youtube-playlist-item:hover { background:rgba(255,255,255,.065); border-color:rgba(255,255,255,.09); }

    .youtube-playlist-thumb img { width:100%; height:100%; object-fit:cover; display:block; }

    .youtube-playlist-play span { width:26px; height:26px; border-radius:50%; background:#fff; color:#111; display:flex; align-items:center; justify-content:center; box-shadow:0 3px 12px rgba(0,0,0,.35); }

    .youtube-playlist-item-title { font-size:11px; line-height:1.3; font-weight:700; color:rgba(255,255,255,.84); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }

    .youtube-playlist-setup-icon { width:42px; height:42px; border-radius:12px; display:flex; align-items:center; justify-content:center; background:rgba(255,69,58,.12); color:#ff453a; border:1px solid rgba(255,69,58,.22); }
    .youtube-playlist-setup-icon svg { width:20px; height:20px; }

    .youtube-playlist-help { color:rgba(255,255,255,.38); font-size:10px; text-decoration:none; }

    .youtube-info-bar {
      min-height:34px; padding:6px 11px; display:flex; align-items:center; gap:7px; background:#111114;
      border-top:1px solid rgba(255,255,255,.09); color:rgba(255,255,255,.55); font-size:10.5px; flex-shrink:0;

    /* Keep authentication/sync completely out of the critical rendering path. */
    #auth-overlay.is-background-sync { pointer-events:none; opacity:0; visibility:hidden; }
    .sync-background-indicator { display:inline-flex; align-items:center; gap:5px; }

    /* ---------- Modal ---------- */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
      animation: fadeIn .18s var(--ease);
    }

    @media (max-width:640px) {
      .modal-overlay {
        padding: 0;
        align-items: flex-end;
      }

      .modal-window {
        max-width: 100%;
        width: 100%;
        max-height: 94vh;
        border-radius: var(--radius-xl) var(--radius-xl) 0 0;
        /* Pull handle hint */
        position: relative;
      }

      .modal-window::before {
        content: '';
        display: block;
        width: 36px;
        height: 4px;
        border-radius: 2px;
        background: var(--panel-border-strong);
        margin: 10px auto -4px;
      }

      .modal-window.wide {
        max-width: 100%;
        max-height: 97vh;
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    .modal-window {
      width: 100%;
      max-width: 500px;
      max-height: 86vh;
      overflow: auto;
      background: var(--panel-bg-solid);
      border: 1px solid var(--panel-border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-window);
      animation: modalIn .2s var(--ease);
      -webkit-overflow-scrolling: touch;
    }

    .modal-window.wide {
      max-width: 720px;
    }

    @keyframes modalIn {
      from {
        opacity: 0;
        transform: scale(.96) translateY(6px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--panel-border);
      position: sticky;
      top: 0;
      background: var(--panel-bg-solid);
      z-index: 2;
    }

    .modal-header h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 0;
    }

    .modal-body {
      padding: 18px;
    }

    .modal-footer {
      padding: 14px 18px;
      border-top: 1px solid var(--panel-border);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      position: sticky;
      bottom: 0;
      background: var(--panel-bg-solid);
      z-index: 2;
    }

    .close-x {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: var(--text-tertiary);
      border: none;
      background: var(--field-bg);
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .close-x:hover {
      color: var(--text-primary);
      background: var(--hover-bg);
    }

    .close-x svg {
      width: 14px;
      height: 14px;
    }

    @media (max-width: 640px) {
      .modal-body {
        padding: 16px;
      }

      .modal-footer {
        padding: 12px 16px;
        padding-bottom: max(12px, env(safe-area-inset-bottom));
      }

      .modal-footer .btn {
        flex: 1;
        justify-content: center;
      }
    }

    /* ---------- Tabs ---------- */
    .tabs {
      display: flex;
      gap: 2px;
      border-bottom: 1px solid var(--panel-border);
      margin-bottom: 16px;
      overflow-x: auto;
    }

    .tab-btn {
      padding: 8px 2px;
      margin-right: 14px;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-tertiary);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      white-space: nowrap;
    }

    .tab-btn.active {
      color: var(--text-primary);
      border-bottom-color: var(--accent);
    }

    .tab-btn svg {
      width: 13px;
      height: 13px;
    }

    /* ---------- Empty / loading ---------- */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 16px;
      color: var(--text-secondary);
    }

    .empty-state .icon-circle {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: var(--field-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      color: var(--text-tertiary);
    }

    .empty-state .icon-circle svg {
      width: 22px;
      height: 22px;
    }

    .empty-state h3 {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      margin: 0 0 4px;
    }

    .empty-state p {
      font-size: 12.5px;
      margin: 0 0 14px;
      max-width: 280px;
      line-height: 1.5;
    }

    /* ---------- Resource / note cards ---------- */
    .resource-card {
      padding: 12px;
      display: flex;
      gap: 10px;
      cursor: pointer;
      align-items: flex-start;
    }

    .resource-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card-hover);
    }

    .res-thumb {
      width: 56px;
      height: 42px;
      border-radius: 8px;
      flex-shrink: 0;
      background: var(--field-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: var(--text-tertiary);
    }

    .res-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .note-card {
      padding: 14px;
      cursor: pointer;
    }

    .note-card:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-2px);
    }

    .note-card h4 {
      margin: 0 0 4px;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .note-card .snippet {
      font-size: 12px;
      color: var(--text-secondary);
      line-height: 1.5;
      max-height: 48px;
      overflow: hidden;
      font-family: var(--font-mono);
    }

    /* ---------- Schedule ---------- */
    .week-grid-wrap {
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .week-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 10px;
    }

    @media (max-width:1000px) {
      .day-col {
        scroll-snap-align: start;
      }

      .week-grid-wrap {
        scroll-snap-type: x proximity;
      }
    }

    .day-col {
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-top: 3px solid var(--day-accent, var(--panel-border));
      border-radius: var(--radius-md);
      padding: 10px;
      min-height: 180px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: background .18s var(--ease), border-color .18s var(--ease), box-shadow .18s var(--ease), transform .18s var(--ease);
    }

    .day-col:hover {
      box-shadow: var(--shadow-card-hover);
    }

    .day-col.is-today {
      background: linear-gradient(180deg, rgba(var(--accent-rgb), 0.09), transparent 65%);
      border-color: rgba(var(--accent-rgb), 0.4);
      box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.18), var(--shadow-card-hover);
      min-height: 210px;
      position: relative;
      z-index: 1;
    }

    .day-col.drag-over {
      background: var(--active-bg);
      border-color: var(--accent);
      transform: scale(1.015);
    }

    .day-col-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .day-col-head .dname {
      font-size: 10.5px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .day-col.is-today .dname {
      color: var(--accent);
      font-size: 11px;
    }

    .today-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 6px var(--accent);
      animation: todayPulse 1.8s ease-in-out infinite;
    }

    @keyframes todayPulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .5;
        transform: scale(1.3);
      }
    }

    .day-col-head .dcount {
      font-size: 10px;
      color: var(--text-tertiary);
      background: var(--field-bg);
      padding: 0 6px;
      border-radius: 20px;
      font-weight: 700;
    }

    .day-col.is-today .dcount {
      background: rgba(var(--accent-rgb), 0.16);
      color: var(--accent);
    }

    .sched-item {
      background: var(--panel-bg-solid);
      border: 1px solid var(--panel-border);
      border-radius: 9px;
      padding: 8px 8px;
      cursor: grab;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: opacity .15s var(--ease), transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease);
      touch-action: none;
      /* allow touch drag */
      user-select: none;
      -webkit-user-select: none;
    }

    .sched-item:hover {
      box-shadow: var(--shadow-card-hover);
      transform: translateY(-1px);
      border-color: var(--panel-border-strong);
    }

    .sched-item:active {
      cursor: grabbing;
    }

    .sched-item.dragging {
      opacity: 0.38;
    }

    /* Always show sd-actions on touch */
    @media (hover: none) {
      .sd-actions .icon-btn {
        opacity: 1 !important;
      }
    }

    .sd-row-top {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .sched-item .sd-icon {
      width: 20px;
      height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .sched-item .sd-icon svg {
      width: 10px;
      height: 10px;
    }

    .sched-item .sd-name {
      font-size: 11.5px;
      font-weight: 700;
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--text-primary);
    }

    .sd-row-bottom {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      padding-left: 26px;
      min-height: 16px;
    }

    .sched-item .sd-time {
      font-size: 9.5px;
      color: var(--text-tertiary);
      font-family: var(--font-mono);
      font-weight: 600;
      white-space: nowrap;
    }

    .sd-actions {
      display: flex;
      gap: 2px;
      flex-shrink: 0;
    }

    .sd-actions .icon-btn {
      width: 18px;
      height: 18px;
      opacity: .55;
      transition: opacity .15s var(--ease), background .15s var(--ease);
    }

    .sd-actions .icon-btn svg {
      width: 8px;
      height: 8px;
    }

    .sched-item:hover .sd-actions .icon-btn {
      opacity: 1;
    }

    .sd-actions .icon-btn:hover {
      opacity: 1;
    }

    .sched-item.completed {
      opacity: 0.5;
    }

    .sched-item.completed .sd-name {
      text-decoration: line-through;
    }

    .day-empty-drop {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-tertiary);
      font-size: 11px;
      text-align: center;
      padding: 8px 4px;
      border: 1.5px dashed var(--panel-border);
      border-radius: 9px;
      transition: border-color .15s var(--ease), color .15s var(--ease);
    }

    .day-col.drag-over .day-empty-drop {
      border-color: var(--accent);
      color: var(--accent);
    }

    .pool-panel {
      padding: 10px;
      margin-bottom: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .pool-item {
      display: flex;
      align-items: center;
      gap: 5px;
      background: var(--panel-bg-solid);
      border: 1px solid var(--panel-border);
      padding: 6px 12px 6px 8px;
      border-radius: 18px;
      cursor: grab;
      font-size: 12px;
      font-weight: 600;
      transition: transform .15s var(--ease), box-shadow .15s var(--ease), border-color .15s var(--ease);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width: 860px) {
      .pool-item {
        padding: 8px 14px 8px 10px;
        font-size: 13px;
      }
    }

    .pool-item:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-card-hover);
      border-color: var(--panel-border-strong);
    }

    .pool-item .sd-icon {
      width: 18px;
      height: 18px;
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pool-item .sd-icon svg {
      width: 10px;
      height: 10px;
    }

    /* ============================================================
       Weekly Schedule — responsive split
       Desktop (>=700px): 7-day grid, drag & drop.
       Mobile (<700px): day-focused view, swipe + tap.
       ============================================================ */
    .sched-desktop-only {
      display: block;
    }

    .sched-mobile-only {
      display: none;
    }

    @media (max-width:700px) {
      .sched-desktop-only {
        display: none;
      }

      .sched-mobile-only {
        display: block;
      }
    }

    /* ---- Week summary strip (compact, both layouts) ---- */
    .week-summary {
      display: flex;
      flex-wrap: wrap;
      gap: 4px 14px;
      font-size: 12px;
      color: var(--text-secondary);
      margin: 2px 0 16px;
    }

    .week-summary b {
      color: var(--text-primary);
      font-weight: 700;
    }

    /* ---- Day strip ---- */
    .day-strip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }

    .day-strip::-webkit-scrollbar {
      display: none;
    }

    .day-chip {
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      min-width: 52px;
      padding: 8px 4px 7px;
      border-radius: 12px;
      border: 1px solid var(--panel-border);
      background: var(--panel-bg);
      color: var(--text-secondary);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
    }

    .day-chip .dc-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: var(--text-tertiary);
      margin-top: 1px;
    }

    .day-chip.is-today .dc-dot {
      background: var(--accent);
    }

    .day-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .day-chip.active .dc-dot {
      background: #fff;
    }

    /* ---- Day focus header ---- */
    .day-focus-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .day-focus-head .dfh-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .day-focus-head .dfh-meta {
      font-size: 12px;
      color: var(--text-tertiary);
      margin-top: 1px;
    }

    .dfh-nav {
      display: flex;
      gap: 6px;
    }

    /* ---- Next session card ---- */
    .next-session-card {
      padding: 14px;
      margin-bottom: 16px;
      border-color: rgba(var(--accent-rgb), 0.35);
      position: relative;
    }

    .next-session-card .ns-eyebrow {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 8px;
    }

    .next-session-card .ns-body {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .next-session-card .ns-icon {
      width: 38px;
      height: 38px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .next-session-card .ns-icon svg {
      width: 18px;
      height: 18px;
    }

    .next-session-card .ns-name {
      font-size: 14.5px;
      font-weight: 700;
    }

    .next-session-card .ns-time {
      font-size: 12px;
      color: var(--text-secondary);
      font-family: var(--font-mono);
      margin-top: 1px;
    }

    .next-session-card .ns-countdown {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      margin-top: 2px;
    }

    /* ---- Mobile session list ---- */
    .day-session-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      touch-action: pan-y;
    }

    .msched-item {
      display: flex;
      gap: 10px;
      padding: 12px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .msched-item .ms-time-col {
      width: 46px;
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      color: var(--text-tertiary);
      padding-top: 2px;
    }

    .msched-item .ms-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .msched-item .ms-icon svg {
      width: 16px;
      height: 16px;
    }

    .msched-item .ms-body {
      flex: 1;
      min-width: 0;
    }

    .msched-item .ms-name {
      font-size: 14px;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .msched-item .ms-meta {
      font-size: 11.5px;
      color: var(--text-tertiary);
      margin-top: 2px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .msched-item .ms-check {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 1.5px solid var(--panel-border-strong);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      color: transparent;
      background: transparent;
      transition: background .15s var(--ease), border-color .15s var(--ease), color .15s var(--ease);
    }

    .msched-item .ms-check svg {
      width: 13px;
      height: 13px;
    }

    .msched-item.completed {
      opacity: 0.55;
    }

    .msched-item.completed .ms-name {
      text-decoration: line-through;
    }

    .msched-item.completed .ms-check {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .day-session-list.swiping {
      transition: transform .18s var(--ease);
    }

    /* ---- Floating add-session action (mobile) ---- */
    .fab-add-session {
      position: fixed;
      right: 16px;
      bottom: calc(76px + env(safe-area-inset-bottom, 0px));
      z-index: 60;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 12px 18px 12px 15px;
      border-radius: 30px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 10px 26px -8px rgba(var(--accent-rgb), 0.55);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .fab-add-session svg {
      width: 16px;
      height: 16px;
    }

    @media (min-width:700px) {
      .fab-add-session {
        display: none;
      }
    }

    /* ---- Quick-action sheet list ---- */
    .qa-list {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .qa-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 10px;
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-primary);
      cursor: pointer;
    }

    .qa-item svg {
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
    }

    .qa-item:hover {
      background: var(--hover-bg);
    }

    .qa-item.qa-danger {
      color: var(--danger);
    }

    .qa-item.qa-danger svg {
      color: var(--danger);
    }

    .day-picker-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .day-picker-row button {
      padding: 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--panel-border);
      background: var(--field-bg);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }

    .day-picker-row button.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .desktop-add-session-btn {
      display: none;
    }

    @media (min-width:700px) {
      .desktop-add-session-btn {
        display: inline-flex;
      }
    }

    /* ---------- Command palette ---------- */
    .cmdk-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(6px);
      z-index: 300;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 10vh;
    }

    .cmdk-box {
      width: 100%;
      max-width: 500px;
      background: var(--panel-bg-solid);
      border: 1px solid var(--panel-border-strong);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-window);
      overflow: hidden;
      animation: modalIn .16s var(--ease);
    }

    .cmdk-input-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--panel-border);
    }

    .cmdk-input-row svg {
      width: 16px;
      height: 16px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    #cmdk-input {
      flex: 1;
      border: none;
      outline: none;
      background: transparent;
      font-size: 14px;
      color: var(--text-primary);
    }

    .cmdk-results {
      max-height: 320px;
      overflow-y: auto;
      padding: 6px;
    }

    .cmdk-group-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      color: var(--text-tertiary);
      font-weight: 700;
      padding: 6px 8px 2px;
    }

    .cmdk-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 8px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-primary);
    }

    .cmdk-item:hover,
    .cmdk-item.sel {
      background: var(--active-bg);
    }

    .cmdk-item svg {
      width: 14px;
      height: 14px;
      color: var(--text-tertiary);
      flex-shrink: 0;
    }

    .cmdk-item .cmdk-sub {
      margin-left: auto;
      font-size: 10.5px;
      color: var(--text-tertiary);
    }

    /* ---------- Toasts ---------- */
    #toast-root {
      position: fixed;
      bottom: 16px;
      right: 16px;
      z-index: 400;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 90%;
    }

    .toast {
      background: var(--panel-bg-solid);
      border: 1px solid var(--panel-border-strong);
      box-shadow: var(--shadow-window);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 12.5px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
      animation: toastIn .22s var(--ease);
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .toast svg {
      width: 14px;
      height: 14px;
      color: var(--success);
    }

    .toast-undo {
      background: none;
      border: none;
      color: var(--accent);
      font-weight: 700;
      font-size: 12px;
      cursor: pointer;
      padding: 2px 0 2px 8px;
      margin-left: 2px;
      -webkit-tap-highlight-color: transparent;
    }

    @media (max-width:700px) {
      #toast-root {
        bottom: calc(148px + env(safe-area-inset-bottom, 0px));
        right: 12px;
        left: 12px;
      }

      .toast {
        justify-content: center;
      }
    }

    /* ---------- Resource cards ---------- */
    .resource-card {
      display:grid; grid-template-columns:112px minmax(0,1fr) auto; gap:12px; padding:10px; align-items:center;
      cursor:pointer; overflow:hidden; position:relative;
    }
    .resource-card:hover { transform:translateY(-2px); box-shadow:var(--shadow-card-hover); border-color:var(--panel-border-strong); }
    .res-thumb {
      width:112px; height:70px; border-radius:12px; overflow:hidden; position:relative; display:flex; align-items:center; justify-content:center;
      background:var(--field-bg); color:var(--text-tertiary); border:1px solid var(--field-border); flex-shrink:0;
    }

        try {

          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) { return null; }
      }
      function saveData(data) {
        if (!data) return false;
        try {
          localStorage.setItem(getStorageKey(), JSON.stringify(data));
          return true;
        } catch (e) { return false; }
      }
      function loadSettings() {
        try {
          const raw = localStorage.getItem(getSettingsKey());
          if (!raw) return { theme: "dark", density: "comfortable", sidebarSize: "default" };

        } catch (e) { return { theme: "dark", density: "comfortable", sidebarSize: "default" }; }

        syncPending: false
      };

      function loadGoogleSession() {
        try {
          const raw = localStorage.getItem(GOOGLE_SESSION_KEY);
          if (!raw) return;
          const saved = JSON.parse(raw);
          Google.profile = saved.profile || null;
          Google.folderId = saved.folderId || null;
          Google.pdfFolderId = saved.pdfFolderId || null;
          Google.fileId = saved.fileId || null;
          Google.lastSynced = saved.lastSynced || null;
          if (Google.profile) Google.signedIn = true;
          if (saved.userId) currentUserId = saved.userId;
        } catch (e) { }
      }
      function saveGoogleSession() {
        try {
          localStorage.setItem(GOOGLE_SESSION_KEY, JSON.stringify({
            profile: Google.profile, folderId: Google.folderId, pdfFolderId: Google.pdfFolderId,
            fileId: Google.fileId, lastSynced: Google.lastSynced, userId: currentUserId
          }));
        } catch (e) { }
      }
      function clearGoogleSession() {
        localStorage.removeItem(GOOGLE_SESSION_KEY);
        Google.profile = null; Google.folderId = null; Google.pdfFolderId = null;
        Google.fileId = null; Google.accessToken = null; Google.signedIn = false; Google.lastSynced = null;
        Google.syncNeedsReconnect = false; Google.syncPending = false;
      }

      function initGoogle() {
        if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
          setTimeout(initGoogle, 250);
          return;
        }
        loadGoogleSession();
        lucide.createIcons({ nodes: [document.getElementById('auth-overlay')] });

        if (Google.profile && currentUserId !== "default") {
          // Optimistic background load for existing session
          DB = loadData() || seedData();
          if (!DB.settings) DB.settings = loadSettings();

          document.getElementById('auth-signin-btn').style.display = 'none';
          document.getElementById('auth-loading').style.display = 'block';
          document.getElementById('auth-loading').textContent = "Restoring session...";

          initAppForUser(); // let them inside the app directly

          Google.tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: GOOGLE_SCOPES,
            // Telling Google which account we mean means it can skip the
            // account-chooser step entirely on a silent refresh — this is the
            // single biggest thing that cuts down on "login again" interruptions.
            login_hint: Google.profile.email || undefined,
            callback: handleTokenResponse
          });
          Google.ready = true;

          // Never block boot on Google auth. The app is already usable from localStorage.
          // A promptless token request can still surface a browser popup in some Google
          // account states, so it is deferred until the app is idle/connected.
          scheduleProactiveTokenRefresh(true);
          setTimeout(() => {
            if (!document.hidden && Google.signedIn && Google.tokenClient && !Google.accessToken) {
              try { Google.tokenClient.requestAccessToken({ prompt: "", login_hint: Google.profile.email || undefined }); } catch (e) { }
            }
          }, 3500);

        } else {
          // Need manual login
          Google.tokenClient = google.accounts.oauth2.initTokenClient({
            client_id: GOOGLE_CLIENT_ID,
            scope: GOOGLE_SCOPES,
            callback: handleTokenResponse
          });
          Google.ready = true;

          const btn = document.getElementById("auth-signin-btn");
          btn.onclick = () => {
            Google.tokenClient.requestAccessToken({ prompt: "consent" });
          };
        }
      }

      async function handleTokenResponse(resp) {
        const isBackgroundAuth = !!DB; // If DB is loaded, it's a background refresh

        if (resp.error) {
          if (!isBackgroundAuth) {
            const authBtn = document.getElementById('auth-signin-btn');
            const loadingText = document.getElementById('auth-loading');
            if (authBtn) authBtn.style.display = 'flex';
            if (loadingText) loadingText.style.display = 'none';
          } else {
            // We're already inside the app with local data — a failed silent
            // refresh just means Drive sync is paused, never kick the user
            // back out to a login screen for this.
            Google.syncNeedsReconnect = true;
            renderGoogleWidget();
          }
          if (resp.error !== "immediate_failed" && resp.error !== "user_logged_out") {
            console.warn("Google silent refresh failed:", resp.error);
          }
          return;
        }
        Google.accessToken = resp.access_token;
        Google.tokenExpiresAt = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
        Google.signedIn = true;
        Google.syncNeedsReconnect = false;
        scheduleProactiveTokenRefresh();

        if (!isBackgroundAuth) {
          const authBtn = document.getElementById('auth-signin-btn');
          const loadingText = document.getElementById('auth-loading');
          if (authBtn) authBtn.style.display = 'none';
          if (loadingText) { loadingText.style.display = 'block'; loadingText.textContent = "Fetching profile & syncing..."; }
        }

        try {
          await fetchGoogleProfile();
          // Use an identifier tied to the Google account to isolate local data correctly
          currentUserId = Google.profile.email || Google.profile.sub || "user_" + Date.now();

          // For fresh logins, we now securely have the currentUserId. Proceed to pull local data
          if (!isBackgroundAuth) {
            DB = loadData() || seedData();
            if (!DB.settings) DB.settings = loadSettings();
          }

          saveGoogleSession();
          await ensureDriveFile();

          if (!isBackgroundAuth) {
            initAppForUser();
            toast(`Signed in as ${Google.profile.given_name || Google.profile.name}`);
          } else {
            renderGoogleWidget(); // Update UI if we were already in background mode
          }
        } catch (e) {
          console.error("Google Drive setup failed", e);
          if (!isBackgroundAuth) {
            const loadingText = document.getElementById('auth-loading');
            const authBtn = document.getElementById('auth-signin-btn');
            if (loadingText) loadingText.textContent = "Error setting up Drive sync. Please try again.";
            if (authBtn) authBtn.style.display = 'flex';
            toast("Drive sync setup failed", "error");
          }
        }
      }

      async function fetchGoogleProfile() {
        const res = await fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
          headers: { Authorization: `Bearer ${Google.accessToken}` }
        });
        if (!res.ok) throw new Error("userinfo request failed");
        const data = await res.json();
        Google.profile = { name: data.name || "", given_name: data.given_name || "", email: data.email || "", picture: data.picture || "" };
      }

      function ensureAccessToken() {
        return new Promise((resolve, reject) => {
          if (Google.accessToken && Date.now() < Google.tokenExpiresAt) { resolve(Google.accessToken); return; }
          if (!Google.tokenClient) { reject(new Error("Google sign-in not ready")); return; }
          const prevCallback = Google.tokenClient.callback;
          Google.tokenClient.callback = (resp) => {
            Google.tokenClient.callback = prevCallback;
            if (resp.error) {
              Google.syncNeedsReconnect = true;
              renderGoogleWidget();
              reject(resp);
              return;
            }
            Google.syncNeedsReconnect = false;
            Google.accessToken = resp.access_token;
            Google.tokenExpiresAt = Date.now() + ((resp.expires_in || 3600) * 1000) - 60000;
            resolve(Google.accessToken);
          };
          // prompt:"" = silent refresh. login_hint tells Google exactly which
          // account we mean so it can skip the account-chooser step if it does
          // need to briefly reconfirm the session.
          Google.tokenClient.requestAccessToken({ prompt: "", login_hint: Google.profile ? Google.profile.email : undefined });
        });
      }

      // Refresh the access token a few minutes before it actually expires,
      // while the tab is idle/visible, instead of waiting for a write to fail.
      // This is what makes edits feel "always synced" — the token is usually
      // already warm by the time the user makes a change.
      let proactiveRefreshTimer = null;
      function scheduleProactiveTokenRefresh(initialBoot = false) {
        if (proactiveRefreshTimer) clearTimeout(proactiveRefreshTimer);
        if (!Google.signedIn) return;
        // If there is no token after a hard refresh, don't immediately create an
        // auth popup. Give the restored app time to paint first.
        const fallbackDelay = initialBoot ? 30000 : 60000;
        const msUntilRefresh = Google.accessToken
          ? Math.max(30000, (Google.tokenExpiresAt || Date.now()) - Date.now() - 5 * 60 * 1000)
          : fallbackDelay;
        proactiveRefreshTimer = setTimeout(async () => {
          if (document.hidden) { scheduleProactiveTokenRefresh(false); return; }
          try {
            if (Google.accessToken || !initialBoot) await ensureAccessToken();
          } catch (e) {
            // Background auth failures never close the app or reopen the login overlay.
          }
          scheduleProactiveTokenRefresh(false);
        }, msUntilRefresh);
      }

      async function driveFetch(url, opts = {}) {
        const token = await ensureAccessToken();
        const headers = Object.assign({}, opts.headers || {}, { Authorization: `Bearer ${token}` });
        const res = await fetch(url, Object.assign({}, opts, { headers }));
        if (!res.ok) {
          const txt = await res.text().catch(() => "");
          throw new Error(`Drive API ${res.status}: ${txt}`);
        }
        return res;
      }

      async function findOrCreateFolder(name, parentId) {
        let q = `name='${name.replace(/'/g, "\\'")}' and mimeType='application/vnd.google-apps.folder' and trashed=false`;
        if (parentId) q += ` and '${parentId}' in parents`;
        const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`);
        const data = await res.json();
        if (data.files && data.files.length) return data.files[0].id;
        const body = { name, mimeType: "application/vnd.google-apps.folder" };
        if (parentId) body.parents = [parentId];
        const createRes = await driveFetch("https://www.googleapis.com/drive/v3/files", {
          method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
        });
        const created = await createRes.json();
        return created.id;
      }

      async function ensureDriveFolder() {
        if (Google.folderId) return Google.folderId;
        Google.folderId = await findOrCreateFolder(GDRIVE_FOLDER_NAME);
        saveGoogleSession();
        return Google.folderId;
      }
      async function ensurePdfFolder() {
        if (Google.pdfFolderId) return Google.pdfFolderId;
        const parent = await ensureDriveFolder();
        Google.pdfFolderId = await findOrCreateFolder(GDRIVE_PDF_FOLDER_NAME, parent);
        saveGoogleSession();
        return Google.pdfFolderId;
      }

      async function ensureDriveFile() {
        const folderId = await ensureDriveFolder();
        if (!Google.fileId) {
          const q = `name='${GDRIVE_DATA_FILE}' and '${folderId}' in parents and trashed=false`;
          const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${encodeURIComponent(q)}&fields=files(id,name)`);
          const data = await res.json();
          if (data.files && data.files.length) Google.fileId = data.files[0].id;
        }
        if (Google.fileId) {
          await pullFromDrive();
        } else {
          await pushToDrive(true);
          toast("Backed up to Google Drive");
        }
        Google.lastSynced = new Date().toISOString();
        saveGoogleSession();
      }

      async function pullFromDrive() {
        if (!Google.fileId) return;
        const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${Google.fileId}?alt=media`);
        const remote = await res.json();
        const remoteTime = remote.meta && remote.meta.lastModified ? new Date(remote.meta.lastModified).getTime() : 0;
        const localTime = DB.meta && DB.meta.lastModified ? new Date(DB.meta.lastModified).getTime() : 0;

        // If local setup is fresh (epoch localTime) OR remote has a newer modified date, pull remote.
        if (remoteTime > localTime && (remote.modules || remote.resources || remote.notes || remote.schedule)) {
          DB = remote;
          if (!DB.settings) DB.settings = loadSettings();
          if (!DB.meta) DB.meta = { lastModified: new Date().toISOString() };
          saveData(DB);
          applyTheme();
          render();
          toast("Synced latest data from Google Drive");
        } else if (localTime > remoteTime) {
          // Update Drive since we have newer local edits
          await pushToDrive(false);
        }
        Google.lastSynced = new Date().toISOString();
        saveGoogleSession();
      }

      async function pushToDrive(isCreate) {
        if (!DB) return;
        DB.meta = DB.meta || { lastModified: new Date().toISOString() };
        const body = JSON.stringify(DB);
        if (isCreate || !Google.fileId) {
          const folderId = await ensureDriveFolder();
          const boundary = "infra2026_" + uid();
          const metadata = { name: GDRIVE_DATA_FILE, parents: [folderId], mimeType: "application/json" };
          const multipartBody =
            `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n` +
            `--${boundary}\r\nContent-Type: application/json\r\n\r\n${body}\r\n` +
            `--${boundary}--`;
          const res = await driveFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", {
            method: "POST", headers: { "Content-Type": `multipart/related; boundary=${boundary}` }, body: multipartBody
          });
          const created = await res.json();
          Google.fileId = created.id;
        } else {
          await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${Google.fileId}?uploadType=media`, {
            method: "PATCH", headers: { "Content-Type": "application/json" }, body
          });
        }
        Google.lastSynced = new Date().toISOString();
        saveGoogleSession();
      }

      const syncToDriveDebounced = debounce(() => {
        if (Google.signedIn && Google.fileId && Google.tokenClient) {
          Google.syncPending = true;
          renderGoogleWidget();
          pushToDrive(false)
            .then(() => { Google.syncPending = false; renderGoogleWidget(); })
            .catch(e => {
              // Never interrupt the user for this — their edit is already safe
              // in localStorage. Just flag it so the account menu shows a
              // one-tap "Reconnect" option, and try again shortly.
              console.error("Drive sync failed", e);
              Google.syncPending = false;
              renderGoogleWidget();
              retryDriveSyncSoon();
            });
        }
      }, 1500);

      let driveRetryTimer = null;
      function retryDriveSyncSoon() {
        if (driveRetryTimer) return;
        driveRetryTimer = setTimeout(() => {
          driveRetryTimer = null;
          if (Google.signedIn && Google.fileId && Google.tokenClient && !Google.syncNeedsReconnect) {
            syncToDriveDebounced();
          }
        }, 60000);
      }

      // Catch up the moment the tab regains focus or the network comes back —
      // this is what keeps things feeling "real time" across devices without
      // asking the user to do anything.
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden && Google.signedIn && Google.fileId) {
          // Sync silently; never force a login overlay or rebuild the current view.
          pullFromDrive().catch(() => { });
        }
      });

      // Lightweight background reconciliation. It is intentionally independent from
      // render(), so studying never flashes or jumps because Drive is syncing.
      let backgroundSyncTimer = null;
      function startBackgroundSync() {
        if (backgroundSyncTimer) clearInterval(backgroundSyncTimer);
        backgroundSyncTimer = setInterval(() => {
          if (!document.hidden && navigator.onLine && Google.signedIn && Google.fileId) {
            pullFromDrive().catch(() => { });
          }
        }, 120000);
      }
      startBackgroundSync();
      window.addEventListener("online", () => {
        if (Google.signedIn && Google.fileId) syncToDriveDebounced();
      });

      async function uploadFileToDrive(file) {
        const folderId = await ensurePdfFolder();
        const token = await ensureAccessToken();
        const metadata = { name: file.name, parents: [folderId] };
        const form = new FormData();
        form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
        form.append("file", file);
        const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink,webContentLink", {
          method: "POST", headers: { Authorization: `Bearer ${token}` }, body: form
        });
        if (!res.ok) throw new Error("Upload failed: " + res.status);
        const data = await res.json();
        try {
          await driveFetch(`https://www.googleapis.com/drive/v3/files/${data.id}/permissions`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ role: "reader", type: "anyone" })
          });
        } catch (e) { }
        return data;
      }

      function googleSignOut() {
        try {
          if (Google.accessToken && window.google && google.accounts && google.accounts.oauth2) {
            google.accounts.oauth2.revoke(Google.accessToken, () => { });
          }
        } catch (e) { }
        if (proactiveRefreshTimer) { clearTimeout(proactiveRefreshTimer); proactiveRefreshTimer = null; }
        if (driveRetryTimer) { clearTimeout(driveRetryTimer); driveRetryTimer = null; }
        clearGoogleSession();

        // Clean up user data from this device to enforce safety/isolation
        deleteUserData();

        DB = null;
        currentUserId = "default";

        document.getElementById('app-window').style.display = 'none';
        document.getElementById('auth-overlay').style.display = 'flex';

        const authBtn = document.getElementById('auth-signin-btn');
        const loadingText = document.getElementById('auth-loading');
        if (authBtn) authBtn.style.display = 'flex';
        if (loadingText) loadingText.style.display = 'none';

        toast("Signed out — local data cleared");
      }

      function renderGoogleWidget() {
        const el = document.getElementById("google-account");
        if (!el) return;
        if (Google.profile) {
          const statusDot = Google.syncNeedsReconnect ? "ga-dot-warn" : (Google.syncPending ? "ga-dot-busy" : "ga-dot-ok");
          const statusLine = Google.syncNeedsReconnect
            ? `<div class="ga-menu-sub ga-menu-sub-warn">Sync paused — tap Reconnect</div>`
            : Google.syncPending
              ? `<div class="ga-menu-sub">Syncing…</div>`
              : `<div class="ga-menu-sub">${Google.lastSynced ? "Synced " + fmtDate(Google.lastSynced) : "Not yet synced"}</div>`;
          el.innerHTML = `
      <div class="ga-user" id="ga-user-btn">
        ${Google.profile.picture ? `<img class="ga-avatar" src="${esc(Google.profile.picture)}" alt="" referrerpolicy="no-referrer" onerror="this.style.display='none'">` : ""}
        <span class="ga-status-dot ${statusDot}"></span>
        <span class="ga-name">${esc(Google.profile.given_name || Google.profile.name || "")}</span>
        ${icon("chevron-down", 'style="width:11px;height:11px"')}
      </div>
      <div class="ga-menu" id="ga-menu">
        <div class="ga-menu-head">
          <div class="ga-menu-name">${esc(Google.profile.name || "")}</div>
          <div class="ga-menu-email">${esc(Google.profile.email || "")}</div>
        </div>
        ${Google.syncNeedsReconnect
              ? `<div class="ga-menu-item ga-menu-warn" id="ga-sync-now">${icon("refresh-cw", 'style="width:13px;height:13px"')}<span>Reconnect</span></div>`
              : `<div class="ga-menu-item" id="ga-sync-now">${icon("refresh-cw", 'style="width:13px;height:13px"')}<span>Sync now</span></div>`}
        ${statusLine}
        <div class="ga-menu-item ga-menu-danger" id="ga-signout">${icon("log-out", 'style="width:13px;height:13px"')}<span>Sign out</span></div>
      </div>
    `;
        }
        renderIcons(el);
        bindGoogleWidgetEvents();
      }

      function bindGoogleWidgetEvents() {
        const userBtn = document.getElementById("ga-user-btn");
        const menu = document.getElementById("ga-menu");
        if (userBtn && menu) {
          userBtn.addEventListener("click", (e) => { e.stopPropagation(); menu.classList.toggle("open"); });
        }
        const syncBtn = document.getElementById("ga-sync-now");
        if (syncBtn) syncBtn.addEventListener("click", async (e) => {
          e.stopPropagation();
          toast("Syncing with Google Drive…");
          try {
            await ensureAccessToken(); // this is the one moment a reconnect prompt is allowed to show
            await ensureDriveFile();
            toast("Synced");
          }
          catch (err) { console.error(err); toast("Sync failed — will retry automatically", "error"); }
          if (menu) menu.classList.remove("open");
          renderGoogleWidget();
        });
        const signoutBtn = document.getElementById("ga-signout");
        if (signoutBtn) signoutBtn.addEventListener("click", (e) => { e.stopPropagation(); googleSignOut(); });
      }

      /* ---------------- Constants ---------------- */
      const COLORS = {
        blue: "#0A84FF", purple: "#BF5AF2", green: "#32D74B", orange: "#FF9F0A",
        red: "#FF453A", cyan: "#64D2FF", pink: "#FF375F", yellow: "#FFD60A"
      };
      const ICONS = ["server", "terminal", "network", "cloud", "shield", "database", "container",
        "git-branch", "code", "cpu", "globe", "lock", "monitor", "hard-drive", "wifi", "boxes"];
      const DAYS = ["monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"];
      const DAY_LABEL = { monday: "Monday", tuesday: "Tuesday", wednesday: "Wednesday", thursday: "Thursday", friday: "Friday", saturday: "Saturday", sunday: "Sunday" };
      const STATUS_OPTS = ["Not Started", "In Progress", "Completed", "Paused"];
      const PRIORITY_OPTS = ["Low", "Medium", "High", "Critical"];
      const RESOURCE_TYPES = [
        { key: "youtube", label: "YouTube", icon: "youtube" },
        { key: "pdf", label: "PDF", icon: "file-text" },
        { key: "website", label: "Website", icon: "globe" },
        { key: "link", label: "Link", icon: "link" }
      ];
      // How long (seconds) of focused viewing counts as "fully studied" per resource type.
      // Progress ticks up in real time while the resource is open and the tab is in focus.
      const RESOURCE_TARGETS = { youtube: 480, pdf: 480, website: 300, link: 120 };
      function resourceProgressDefaults(r) {
        if (r.progress == null) r.progress = 0;
        if (!r.status) r.status = "Not Started";
        if (r.timeSpent == null) r.timeSpent = 0;
        return r;
      }

      /* ---------------- Utilities ---------------- */
      const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
      const now = () => new Date().toISOString();
      const esc = (s = "") => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
      const fmtDate = (iso) => new Date(iso).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
      function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

      function toast(msg, kind = "success") {
        const root = document.getElementById("toast-root");
        const el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = `<i data-lucide="${kind === 'error' ? 'alert-circle' : 'check-circle-2'}"></i><span>${esc(msg)}</span>`;
        root.appendChild(el);
        lucide.createIcons({ nodes: [el] });
        setTimeout(() => { el.style.transition = "opacity .2s ease, transform .2s ease"; el.style.opacity = "0"; el.style.transform = "translateY(6px)"; setTimeout(() => el.remove(), 200); }, 2600);
      }

      function icon(name, attrs = "") { return `<i data-lucide="${name}" ${attrs}></i>`; }
      function renderIcons(container) { lucide.createIcons({ nodes: container ? [container] : undefined }); }

      /* ---------------- State ---------------- */
      const State = {
        route: "dashboard",
        moduleId: null,
        resourceFilter: "all",
        moduleFilter: "all",
        moduleTab: "resources",
        sidebarCompact: false,
        scheduleDay: null // selected day on the mobile day-focused schedule view
      };

      const getModule = id => DB.modules.find(m => m.id === id);
      const moduleResources = id => DB.resources.filter(r => r.moduleId === id);
      const moduleNotes = id => DB.notes.filter(n => n.moduleId === id);
      const moduleSchedule = id => DB.schedule.filter(s => s.moduleId === id);
      function updateModuleTimestamp(id) { const m = getModule(id); if (m) m.updatedAt = now(); }
      function setProgress(moduleId, val) {
        const m = getModule(moduleId); if (!m) return;
        const was100 = m.progress >= 100;
        m.progress = Math.max(0, Math.min(100, val));
        if (m.progress >= 100) { m.status = "Completed"; if (!was100) celebrate(); }
        else if (m.status === "Completed" && m.progress < 100) { m.status = "In Progress"; }
        m.updatedAt = now();
        persist();
      }
      function celebrate() { toast("Module completed 🎉", "success"); }

      // Once a module has resources, its progress is derived automatically from how much
      // of each resource has been studied — no manual slider needed.
      function autoSyncModuleProgress(moduleId) {
        const m = getModule(moduleId); if (!m) return;
        const res = moduleResources(moduleId);
        if (!res.length) return;
        res.forEach(resourceProgressDefaults);
        const avg = Math.round(res.reduce((a, r) => a + (r.progress || 0), 0) / res.length);
        const was100 = m.progress >= 100;
        m.progress = avg;
        if (avg >= 100) { m.status = "Completed"; if (!was100) celebrate(); }
        else if (avg > 0) { m.status = "In Progress"; }
        else if (m.status !== "Paused") { m.status = "Not Started"; }
        m.updatedAt = now();
      }

      /* ---------------- Sidebar ---------------- */
      const NAV_ITEMS = [
        { key: "dashboard", label: "Dashboard", icon: "layout-dashboard" },
        { key: "modules", label: "Modules", icon: "layers" },
