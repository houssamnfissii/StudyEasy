      /* ---------------- Resource helpers ---------------- */
      function ytId(url = "") {
        try {
          const u = new URL(url);
          if (!/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(u.hostname)) return null;
          const v = u.searchParams.get("v");
          if (v && /^[a-zA-Z0-9_-]{6,}$/.test(v)) return v;
          const m = u.pathname.match(/\/(?:embed|shorts|live)\/([a-zA-Z0-9_-]{6,})/);
          if (m) return m[1];
          const short = u.hostname === "youtu.be" ? u.pathname.slice(1).split("/")[0] : null;
          return short && /^[a-zA-Z0-9_-]{6,}$/.test(short) ? short : null;
        } catch (e) {
          const m = String(url).match(/(?:v=|youtu\.be\/|youtube\.com\/(?:embed|shorts|live)\/)([a-zA-Z0-9_-]{6,})/);
          return m ? m[1] : null;
        }
      }

      // Detect a YouTube playlist from playlist links, watch links, shorts/live links, etc.
      function ytPlaylistId(url = "") {
        try {
          const u = new URL(url);
          if (!/(^|\.)youtube\.com$|(^|\.)youtu\.be$/.test(u.hostname)) return null;
          const id = u.searchParams.get("list");
          return id && /^[a-zA-Z0-9_-]{6,}$/.test(id) ? id : null;
        } catch (e) {
          const m = String(url).match(/[?&]list=([a-zA-Z0-9_-]{6,})/);
          return m ? m[1] : null;
        }
      }

      function ytPlaylistIndex(url = "") {
        try {
          const u = new URL(url);
          const raw = u.searchParams.get("index");
          const n = raw == null ? 0 : parseInt(raw, 10);
          return Number.isFinite(n) && n >= 0 ? n : 0;
        } catch (e) {
          const m = String(url).match(/[?&]index=(\d+)/);
          return m ? Math.max(0, parseInt(m[1], 10)) : 0;
        }
      }

      function isYouTubeResourceUrl(url = "") {
        return !!ytId(url) || !!ytPlaylistId(url);
      }

      function youtubeEmbedUrl(url = "") {
        const playlist = ytPlaylistId(url);
        const video = ytId(url);
        const index = ytPlaylistIndex(url);
        const params = new URLSearchParams({
          rel: "0",
          modestbranding: "1",
          playsinline: "1",
          autoplay: "0",
          fs: "1",
          iv_load_policy: "3"
        });
        if (playlist) {
          params.set("listType", "playlist");
          params.set("list", playlist);
          if (video) {
            // A real video + list URL gives YouTube the strongest native
            // playlist behavior: previous/next + the embedded More videos panel.
            return `https://www.youtube.com/embed/${video}?${params.toString()}`;
          }
          params.set("index", String(index));
          return `https://www.youtube.com/embed/videoseries?${params.toString()}`;
        }
        return video ? `https://www.youtube.com/embed/${video}?${params.toString()}` : null;
      }

      // StudyEasy playlist player: use the YouTube IFrame API only for playlist
      // navigation/list discovery. The actual video remains inside the official
      // YouTube iframe. If the API is blocked, we fall back to the native player.
      let activeYouTubePlayer = null;
      let activeYouTubeCleanup = null;
      let youtubeApiPromise = null;

      function waitForYouTubeApi(timeout = 9000) {
        if (window.YT && typeof window.YT.Player === "function") return Promise.resolve(window.YT);
        if (youtubeApiPromise) return youtubeApiPromise;
        youtubeApiPromise = new Promise((resolve, reject) => {
          const started = Date.now();
          const check = () => {
            if (window.YT && typeof window.YT.Player === "function") return resolve(window.YT);
            if (Date.now() - started > timeout) return reject(new Error("YouTube API timeout"));
            setTimeout(check, 120);
          };
          check();
        });
        return youtubeApiPromise;
      }

      function destroyActiveYouTubePlayer() {
        try { if (typeof activeYouTubeCleanup === "function") activeYouTubeCleanup(); } catch (e) {}
        try { if (activeYouTubePlayer && typeof activeYouTubePlayer.destroy === "function") activeYouTubePlayer.destroy(); } catch (e) {}
        activeYouTubeCleanup = null;
        activeYouTubePlayer = null;
      }

      function playlistVideoTitle(videoId, index, resource) {
        const known = DB.resources.find(x => x.type === "youtube" && ytId(x.url) === videoId);
        return known?.title || (videoId === ytId(resource.url) ? resource.title : `Video ${index + 1}`);
      }

      async function hydratePlaylistTitles(items, resource, listEl) {
        const visible = items.slice(0, 60);
        await Promise.all(visible.map(async (item, i) => {
          const known = DB.resources.find(x => x.type === "youtube" && ytId(x.url) === item.videoId);
          if (known) return;
          try {
            const response = await fetch(`https://www.youtube.com/oembed?url=${encodeURIComponent(`https://www.youtube.com/watch?v=${item.videoId}`)}&format=json`, { mode: "cors" });
            if (!response.ok) return;
            const data = await response.json();
            item.title = data.title || item.title;
            const node = listEl.querySelector(`[data-yt-play-index="${i}"] .youtube-playlist-item-title`);
            if (node) node.textContent = item.title;
          } catch (e) {}
        }));
      }

      function renderStudyEasyPlaylist(listEl, items, currentIndex, resource, onSelect) {
        listEl.innerHTML = items.length ? items.map((item, i) => `
          <button type="button" class="youtube-playlist-item ${i === currentIndex ? 'active' : ''}" data-yt-play-index="${i}">
            <span class="youtube-playlist-thumb">
              <img loading="lazy" src="https://i.ytimg.com/vi/${esc(item.videoId)}/mqdefault.jpg" alt="">
              <span class="youtube-playlist-index">${i + 1}</span>
              <span class="youtube-playlist-play"><span>${icon('play')}</span></span>
            </span>
            <span class="youtube-playlist-meta">
              <span class="youtube-playlist-item-title">${esc(item.title || playlistVideoTitle(item.videoId, i, resource))}</span>
              <span class="youtube-playlist-item-sub">${esc(item.channel || 'YouTube')}</span>
            </span>
          </button>`).join('') : `<div class="youtube-playlist-empty">No videos were found in this playlist.</div>`;
        listEl.querySelectorAll('[data-yt-play-index]').forEach(btn => {
          btn.addEventListener('click', () => onSelect(Number(btn.dataset.ytPlayIndex)));
        });
        renderIcons(listEl);
        const active = listEl.querySelector('.youtube-playlist-item.active');
        active?.scrollIntoView({ block: 'nearest' });

      function getYouTubeApiKey() {
        const fromDb = DB?.settings?.youtubeApiKey;
        if (fromDb) return String(fromDb).trim();
        try { return String(localStorage.getItem("studyeasy_youtube_api_key") || "").trim(); } catch (e) { return ""; }
      }

      function saveYouTubeApiKey(value) {
        const key = String(value || "").trim();
        if (!DB.settings) DB.settings = {};
        DB.settings.youtubeApiKey = key;
        try { localStorage.setItem("studyeasy_youtube_api_key", key); } catch (e) {}
        saveSettings(DB.settings);
        persist();
      }

      async function fetchYouTubePlaylistItems(playlistId, apiKey) {
        if (!playlistId || !apiKey) throw new Error("Missing YouTube Data API key");
        const out = [];
        let pageToken = "";
        for (let page = 0; page < 10; page++) {
          const url = new URL("https://www.googleapis.com/youtube/v3/playlistItems");
          url.searchParams.set("part", "snippet,contentDetails");
          url.searchParams.set("playlistId", playlistId);
          url.searchParams.set("maxResults", "50");
          url.searchParams.set("key", apiKey);
          if (pageToken) url.searchParams.set("pageToken", pageToken);
          const response = await fetch(url.toString(), { mode: "cors", cache: "no-store" });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || data.error) throw new Error(data?.error?.message || `YouTube API ${response.status}`);
          for (const item of (data.items || [])) {
            const videoId = item?.contentDetails?.videoId || item?.snippet?.resourceId?.videoId;
            if (!videoId) continue;
            out.push({
              videoId,
              title: item?.snippet?.title || `Video ${out.length + 1}`,
              channel: item?.snippet?.videoOwnerChannelTitle || item?.snippet?.channelTitle || "YouTube",
              thumb: item?.snippet?.thumbnails?.medium?.url || item?.snippet?.thumbnails?.default?.url || `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg`
            });
          }
          pageToken = data.nextPageToken || "";
          if (!pageToken) break;
        }
        return out;
      }

      function localPlaylistItems(playlistId, resource) {
        const seen = new Set();
        const out = [];
        for (const item of (DB?.resources || [])) {
          if (item.type !== "youtube" || ytPlaylistId(item.url) !== playlistId) continue;
          const videoId = ytId(item.url);
          if (!videoId || seen.has(videoId)) continue;
          seen.add(videoId);
          out.push({ videoId, title: item.title || `Video ${out.length + 1}`, channel: "StudyEasy", thumb: `https://i.ytimg.com/vi/${videoId}/mqdefault.jpg` });
        }
        const current = ytId(resource.url);
        if (current && !seen.has(current)) out.unshift({ videoId: current, title: resource.title || "Current video", channel: "YouTube", thumb: `https://i.ytimg.com/vi/${current}/mqdefault.jpg` });
        return out;
      }

      function renderPlaylistSetup(root, listEl, playlistId, resource, initialVideo, reason = "") {
        const key = getYouTubeApiKey();
        const local = localPlaylistItems(playlistId, resource);
        listEl.innerHTML = `
          <div class="youtube-playlist-empty youtube-playlist-setup">
            <div class="youtube-playlist-setup-icon">${icon('list-video')}</div>
            <strong>Playlist list is ready to connect</strong>
            <p>${reason ? esc(reason) : 'Your browser is blocking the YouTube playlist API.'}</p>
            ${local.length > 1 ? `<button type="button" class="btn btn-secondary btn-sm" data-use-local-playlist>${icon('list')} Use ${local.length} StudyEasy videos</button>` : ''}
            <button type="button" class="btn btn-primary btn-sm" data-youtube-api-setup>${icon('key-round')} Connect playlist list</button>
            <a class="youtube-playlist-help" href="https://developers.google.com/youtube/v3/getting-started" target="_blank" rel="noopener">Get a YouTube Data API key</a>
          </div>`;
        renderIcons(listEl);
        listEl.querySelector('[data-use-local-playlist]')?.addEventListener('click', () => {
          const items = localPlaylistItems(playlistId, resource);
          if (items.length) mountIframePlaylistQueue(root, resource, playlistId, items, initialVideo);
        });
        listEl.querySelector('[data-youtube-api-setup]')?.addEventListener('click', () => {
          const entered = prompt("Paste your YouTube Data API v3 key. It is stored only in this browser.", key || "");
          if (entered == null) return;
          saveYouTubeApiKey(entered);
          mountStudyEasyPlaylistPlayer(root, resource, playlistId, initialVideo);
        });
      }

      function mountIframePlaylistQueue(root, resource, playlistId, items, initialVideo) {
        const frame = root.querySelector('#youtube-resource-frame');
        const listEl = root.querySelector('#youtube-playlist-items');
        const countEl = root.querySelector('#youtube-playlist-count');
        if (!frame || !listEl || !items?.length) return;
        const mount = root.querySelector('#youtube-api-player');
        if (mount) mount.style.display = 'none';
        frame.style.display = 'block';
        let currentIndex = Math.max(0, items.findIndex(x => x.videoId === initialVideo));
        if (currentIndex < 0) currentIndex = 0;
        const titleEl = root.querySelector('#youtube-current-title');
        countEl.textContent = `${items.length} video${items.length === 1 ? '' : 's'}`;
        const select = (index, autoplay = true) => {
          currentIndex = Math.max(0, Math.min(items.length - 1, index));
          const item = items[currentIndex];
          const u = `https://www.youtube.com/watch?v=${encodeURIComponent(item.videoId)}&list=${encodeURIComponent(playlistId)}&index=${currentIndex + 1}`;
          const embed = youtubeEmbedUrl(u);
          if (embed) frame.src = embed;
          if (titleEl) titleEl.textContent = item.title || `Video ${currentIndex + 1}`;
          renderStudyEasyPlaylist(listEl, items, currentIndex, resource, i => select(i));
        };
        renderStudyEasyPlaylist(listEl, items, currentIndex, resource, select);
        if (titleEl) titleEl.textContent = items[currentIndex].title || resource.title;
        root.querySelector('[data-yt-native-action="previous"]')?.addEventListener('click', () => select(currentIndex - 1));
        root.querySelector('[data-yt-native-action="next"]')?.addEventListener('click', () => select(currentIndex + 1));
        root.querySelector('[data-yt-shuffle]')?.addEventListener('click', () => {
          const current = items[currentIndex];
          const shuffled = [...items].sort(() => Math.random() - 0.5);
          const idx = shuffled.findIndex(x => x.videoId === current.videoId);
          if (idx > 0) { const [first] = shuffled.splice(idx, 1); shuffled.unshift(first); }
          items.splice(0, items.length, ...shuffled);
          currentIndex = 0;
          renderStudyEasyPlaylist(listEl, items, currentIndex, resource, select);
        });
        root.querySelector('[data-yt-repeat]')?.addEventListener('click', e => {
          e.currentTarget.classList.toggle('active');
          e.currentTarget.setAttribute('aria-pressed', e.currentTarget.classList.contains('active'));
        });
      }

      async function mountStudyEasyPlaylistPlayer(root, resource, playlist, initialVideo) {
        const frame = root.querySelector('#youtube-resource-frame');
        const mount = root.querySelector('#youtube-api-player');
        const listEl = root.querySelector('#youtube-playlist-items');
        const countEl = root.querySelector('#youtube-playlist-count');
        if (!frame || !mount || !listEl) return;

        // Keep the iframe visible as the first-frame fallback while the API boots.
        try {
          await waitForYouTubeApi();
          const player = await new Promise((resolve, reject) => {
            let settled = false;
            const finish = fn => value => { if (!settled) { settled = true; fn(value); } };
            const timer = setTimeout(finish(reject)(new Error('player timeout')), 9000);
            new YT.Player(mount, {
              playerVars: {
                autoplay: 0, controls: 1, rel: 0, modestbranding: 1, playsinline: 1,
                listType: 'playlist', list: playlist, index: ytPlaylistIndex(resource.url),
                origin: location.origin
              },
              events: {
                onReady: e => { clearTimeout(timer); finish(resolve)(e.target); },
                onError: e => { clearTimeout(timer); if (!settled) finish(reject)(new Error(`YouTube error ${e.data}`)); }
              }
            });
          });
          activeYouTubePlayer = player;
          frame.style.display = 'none';
          mount.style.display = 'block';

          let ids = [];
          try { ids = player.getPlaylist() || []; } catch (e) {}
          if (!ids.length) {
            listEl.innerHTML = `<div class="youtube-playlist-empty">YouTube did not expose this playlist to the embedded player. The video above is still available.</div>`;
            return;
          }
          const items = ids.map((videoId, i) => ({ videoId, title: playlistVideoTitle(videoId, i, resource), channel: '' }));
          countEl.textContent = `${items.length} video${items.length === 1 ? '' : 's'}`;
          const selectedId = player.getVideoData?.().video_id || initialVideo;
          let currentIndex = Math.max(0, ids.indexOf(selectedId));
          const select = (index) => {
            currentIndex = Math.max(0, Math.min(items.length - 1, index));
            player.loadVideoById(items[currentIndex].videoId);
            renderStudyEasyPlaylist(listEl, items, currentIndex, resource, select);
            const titleEl = root.querySelector('#youtube-current-title');
            if (titleEl) titleEl.textContent = items[currentIndex].title;
          };
          renderStudyEasyPlaylist(listEl, items, currentIndex, resource, select);
          if (initialVideo && initialVideo !== ids[currentIndex]) {
            const initialIndex = ids.indexOf(initialVideo);
            if (initialIndex >= 0) { currentIndex = initialIndex; player.loadVideoById(initialVideo); renderStudyEasyPlaylist(listEl, items, currentIndex, resource, select); }
          }
          hydratePlaylistTitles(items, resource, listEl);

          const syncCurrent = (event) => {
            if (event === 0) {
              const repeatBtn = root.querySelector('[data-yt-repeat]');
              if (repeatBtn?.classList.contains('active')) { player.playVideo(); return; }
              if (currentIndex < items.length - 1) { select(currentIndex + 1); return; }
            }
            let data = {};
            try { data = player.getVideoData?.() || {}; } catch (e) {}
            const idx = data.video_id ? ids.indexOf(data.video_id) : currentIndex;
            if (idx >= 0) {
              currentIndex = idx;
              renderStudyEasyPlaylist(listEl, items, currentIndex, resource, select);
              const titleEl = root.querySelector('#youtube-current-title');
              if (titleEl) titleEl.textContent = items[currentIndex].title;
            }
          };
          player.addEventListener?.('onStateChange', syncCurrent);
          activeYouTubeCleanup = () => {
            try { player.removeEventListener?.('onStateChange', syncCurrent); } catch (e) {}
          };
          root.querySelector('[data-yt-native-action="previous"]')?.addEventListener('click', () => select(currentIndex - 1));
          root.querySelector('[data-yt-native-action="next"]')?.addEventListener('click', () => select(currentIndex + 1));
          root.querySelector('[data-yt-shuffle]')?.addEventListener('click', () => {
            const order = [...items].sort(() => Math.random() - 0.5);
            items.splice(0, items.length, ...order);
            renderStudyEasyPlaylist(listEl, items, 0, resource, select);
            select(0);
          });
          root.querySelector('[data-yt-repeat]')?.addEventListener('click', e => {
            e.currentTarget.classList.toggle('active');
            e.currentTarget.setAttribute('aria-pressed', e.currentTarget.classList.contains('active'));
          });
        } catch (error) {
          // Browser extensions often block the IFrame API. Do not leave the
          // StudyEasy sidebar stuck on "Loading". Use the Data API when a key
          // is configured; otherwise expose a working local queue/setup panel.
          frame.style.display = 'block';
          mount.style.display = 'none';
          const key = getYouTubeApiKey();
          if (key) {
            try {
              const items = await fetchYouTubePlaylistItems(playlist, key);
              if (items.length) {
                mountIframePlaylistQueue(root, resource, playlist, items, initialVideo);
                return;
              }
              throw new Error("The playlist contains no playable public videos.");
            } catch (apiError) {
              renderPlaylistSetup(root, listEl, playlist, resource, initialVideo, apiError.message || "The YouTube Data API could not read this playlist.");
              const countEl = root.querySelector('#youtube-playlist-count');
              if (countEl) countEl.textContent = "Needs playlist access";
              return;
            }
          }
          renderPlaylistSetup(root, listEl, playlist, resource, initialVideo, "The browser blocked YouTube's IFrame API. You can still use the official player above.");
          const countEl = root.querySelector('#youtube-playlist-count');
          if (countEl) countEl.textContent = "Native player active";
        }
      }

      function driveFileId(url = "") {
        const m = url.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
        return (m && url.includes("drive.google.com")) ? m[1] : null;
      }
      // Google Drive's normal "/view" share link refuses to render inside an <iframe>
      // (that's the "Authorization required" screen). The "/preview" endpoint is the
      // one Google designed for embedding, so we rewrite Drive links to that form.
      function toEmbeddablePdfUrl(url = "") {
        const id = driveFileId(url);
        return id ? `https://drive.google.com/file/d/${id}/preview` : url;
      }
      function resourceIconName(type) {
        return { youtube: "youtube", pdf: "file-text", website: "globe", link: "link" }[type] || "link";
      }
      function resourceTypeColor(type) {
        return { youtube: "#FF453A", pdf: "#0A84FF", website: "#32D74B", link: "#BF5AF2" }[type] || COLORS.blue;
      }

      function resourceCard(r, showModule) {

        const yt = r.type === "youtube" ? ytId(r.url) : null;
        const playlist = r.type === "youtube" ? ytPlaylistId(r.url) : null;

        return `
  <div class="panel resource-card ${playlist ? 'resource-card-playlist' : ''}" data-open-resource="${r.id}">
    <div class="res-thumb ${playlist ? 'res-thumb-playlist' : ''}">
      ${thumb ? `<img src="${thumb}" loading="lazy" alt="">` : icon(resourceIconName(r.type), `style="width:18px;height:18px;color:${typeColor}"`)}
      ${playlist ? `<span class="res-thumb-overlay">${icon('list-video')}</span>` : `<span class="res-play-hint">${icon('play')}</span>`}
      ${playlist ? `<span class="res-play-hint">${icon('play')}</span>` : ''}
    </div>
    <div class="resource-card-main">

        <span class="resource-badge resource-badge-type resource-badge-${r.type}">${icon(resourceIconName(r.type), 'class="resource-badge-icon"')}<span>${esc(r.type)}</span></span>
        ${playlist ? `<span class="resource-badge resource-badge-playlist">${icon('list-video', 'class="resource-badge-icon"')}<span>Playlist</span></span>` : ''}
        <span class="resource-badge resource-badge-status" style="--badge-color:${statusColor(r.status)}">${esc(r.status)}</span>
      </div>
      <h4 class="resource-card-title">${esc(r.title)}</h4>
      <p class="resource-card-desc">${esc(r.description || "Open to start studying.")}</p>
      ${r.progress > 0 ? `<div class="resource-progress-row"><div class="progress-track resource-progress-track"><div class="progress-fill" style="width:${r.progress}%;background:${typeColor};"></div></div><span class="resource-progress-pct">${r.progress}%</span></div>` : ''}
    </div>
    <div class="resource-card-actions">
      <button class="icon-btn" data-delete-resource="${r.id}" title="Delete">${icon('trash-2')}</button>
    </div>
  </div>`;
      }

      function noteCard(n) {
        return `
  <div class="panel note-card" data-open-note="${n.id}">
    <h4>${n.pinned ? icon('pin', 'class="pin-star" style="width:11px;height:11px"') : ""}${esc(n.title || "Untitled")}</h4>

      /* ---------------- Schedule ---------------- */
      const DAY_SHORT = { monday: "Mon", tuesday: "Tue", wednesday: "Wed", thursday: "Thu", friday: "Fri", saturday: "Sat", sunday: "Sun" };
      const DAY_ACCENTS = [COLORS.blue, COLORS.purple, COLORS.green, COLORS.orange, COLORS.pink, COLORS.cyan, COLORS.red];

      function todayKey() { return DAYS[(new Date().getDay() + 6) % 7]; }
      function timeToMinutes(t) {
        if (!t || typeof t !== "string" || !t.includes(":")) return null;
        const [h, m] = t.split(":").map(Number);
        if (Number.isNaN(h) || Number.isNaN(m)) return null;
        return h * 60 + m;
      }
      function durationMinutes(s) {
        const a = timeToMinutes(s.startTime), b = timeToMinutes(s.endTime);
        if (a == null || b == null || b <= a) return 0;
        return b - a;
      }
      function fmtDuration(mins) {
        mins = Math.round(mins);
        if (mins <= 0) return "0m";
        const h = Math.floor(mins / 60), m = mins % 60;
        if (h && m) return `${h}h ${m}m`;
        if (h) return `${h}h`;
        return `${m}m`;
      }
      function scheduleSort(a, b) {
        const ta = timeToMinutes(a.startTime); const tb = timeToMinutes(b.startTime);
        const va = ta == null ? 9999 : ta, vb = tb == null ? 9999 : tb;
        if (va !== vb) return va - vb;
        return (a.order || 0) - (b.order || 0);
      }
      function dayItems(day) { return DB.schedule.filter(s => s.day === day).sort(scheduleSort); }
      function nextUpcomingSessionToday() {
        const items = dayItems(todayKey()).filter(s => !s.completed);
        if (!items.length) return null;
        const nowMin = new Date().getHours() * 60 + new Date().getMinutes();
        return items.find(s => { const t = timeToMinutes(s.startTime); return t == null || t >= nowMin; }) || items[0];
      }

      function renderWeekSummary() {
        const items = DB.schedule;
        const total = items.length;
        if (!total) return "";
        const done = items.filter(s => s.completed).length;
        const plannedMin = items.reduce((a, s) => a + durationMinutes(s), 0);
        return `<div class="week-summary">
      <span>This week · <b>${total}</b> session${total === 1 ? '' : 's'}</span>
      <span><b>${done}</b> completed</span>
      ${plannedMin ? `<span><b>${fmtDuration(plannedMin)}</b> planned</span>` : ""}
    </div>`;
      }

      function renderSchedulePage() {
        if (!State.scheduleDay || !DAYS.includes(State.scheduleDay)) State.scheduleDay = todayKey();
        return `
    <div class="flex-between">
      <div>
        <h1 class="page-title">Weekly Schedule</h1>
        <p class="page-sub" style="margin-bottom:0;">Plan your week and track study time.</p>
      </div>
      <button class="btn btn-secondary desktop-add-session-btn" data-open-add-session="${State.scheduleDay}">${icon('plus', 'style="width:13px;height:13px"')} Add session</button>
    </div>
    ${renderWeekSummary()}
    <div class="sched-desktop-only">
      <div class="panel pool-panel">
        <span class="eyebrow" style="width:100%;">Drag a module onto a day, or use Add session</span>
        ${DB.modules.length ? DB.modules.map(m => `
          <div class="pool-item" draggable="true" data-drag-module="${m.id}">
            <div class="sd-icon" style="background:${COLORS[m.color]}22; color:${COLORS[m.color]};">${icon(m.icon)}</div>
            ${esc(m.name)}
          </div>`).join("") : `<span style="font-size:12px;color:var(--text-tertiary);">Add a module first, then schedule it here.</span>`}
      </div>

      ${renderMobileSchedule()}
    </div>
    <button class="fab-add-session" data-open-add-session="${State.scheduleDay}">${icon('plus')} Add session</button>
  `;
      }

      function renderMobileSchedule() {
        const day = State.scheduleDay;
        const tKey = todayKey();
        const items = dayItems(day);
        const plannedMin = items.reduce((a, s) => a + durationMinutes(s), 0);
        const next = day === tKey ? nextUpcomingSessionToday() : null;
        return `
    <div class="day-strip" id="day-strip">
      ${DAYS.map(d => `
        <button type="button" class="day-chip ${d === day ? 'active' : ''} ${d === tKey ? 'is-today' : ''}" data-mobile-day="${d}">
          ${DAY_SHORT[d]}<span class="dc-dot"></span>
        </button>`).join("")}
    </div>
    <div class="day-focus-head">
      <div>
        <div class="dfh-title">${DAY_LABEL[day]}${day === tKey ? ' · Today' : ''}</div>
        <div class="dfh-meta">${items.length} session${items.length === 1 ? '' : 's'}${items.length ? ' · ' + fmtDuration(plannedMin) + ' planned' : ''}</div>
      </div>
      <div class="dfh-nav">
        <button class="icon-btn" data-day-nav="prev" title="Previous day">${icon('chevron-left')}</button>
        <button class="icon-btn" data-day-nav="next" title="Next day">${icon('chevron-right')}</button>
      </div>
    </div>
    ${next ? renderNextSessionCard(next) : ""}
    <div class="day-session-list" id="day-session-list">
      ${items.length ? items.map(s => scheduleItemMobileHtml(s)).join("") : renderScheduleEmptyState(day)}

      function renderNextSessionCard(s) {
        const m = getModule(s.moduleId); if (!m) return "";
        const color = COLORS[m.color];

        let countdown = "";

          countdown = t <= nowMin ? "In progress" : `Starts in ${fmtDuration(t - nowMin)}`;
        }
        return `<div class="panel next-session-card">
      <div class="ns-eyebrow">${icon('zap', 'style="width:11px;height:11px"')} Next up</div>
      <div class="ns-body">

      function renderScheduleEmptyState(day) {

      function scheduleItemMobileHtml(s) {
        const m = getModule(s.moduleId);

        const dur = durationMinutes(s);
        return `
  <div class="panel msched-item ${s.completed ? 'completed' : ''}" data-open-quick-actions="${s.id}">

    <button class="ms-check" data-toggle-sched="${s.id}" title="Mark complete">${icon('check')}</button>

      function weekGridTemplate() {
        const todayIdx = new Date().getDay();
        const todayKey = DAYS[(todayIdx + 6) % 7];
        const isNarrow = window.matchMedia("(max-width:1000px)").matches;
        if (isNarrow) {
          const base = window.matchMedia("(max-width:700px)").matches ? 140 : 170;
          const big = Math.round(base * 1.3);
          return DAYS.map(d => `${d === todayKey ? big : base}px`).join(" ");
        }
        return DAYS.map(d => d === todayKey ? "1.34fr" : "1fr").join(" ");
      }

      function renderDayColumn(day) {
        const items = DB.schedule.filter(s => s.day === day).sort((a, b) => a.order - b.order);
        const todayIdx = new Date().getDay();
        const todayKey = DAYS[(todayIdx + 6) % 7];
        const isToday = day === todayKey;
        const accent = DAY_ACCENTS[DAYS.indexOf(day)];
        return `
  <div class="day-col ${isToday ? 'is-today' : ''}" data-day-col="${day}" style="--day-accent:${accent}66;">

      function scheduleItemHtml(s) {
        const m = getModule(s.moduleId);
        if (!m) return "";
        const color = COLORS[m.color];
        const timeLabel = (s.startTime || s.endTime) ? `${s.startTime || '--:--'}${s.endTime ? ' – ' + s.endTime : ''}` : "";
        return `
  <div class="sched-item ${s.completed ? 'completed' : ''}" draggable="true" data-sched-item="${s.id}">
    <div class="sd-row-top">
      <div class="sd-icon" style="background:${color}22; color:${color};">${icon(m.icon)}</div>
      <div class="sd-name">${esc(m.name)}</div>
    </div>
    <div class="sd-row-bottom">
      <span class="sd-time">${timeLabel}</span>
      <div class="sd-actions">
        <button class="icon-btn" data-toggle-sched="${s.id}" title="Toggle">${icon(s.completed ? 'rotate-ccw' : 'check')}</button>
        <button class="icon-btn" data-edit-sched="${s.id}" title="Time">${icon('clock')}</button>
        <button class="icon-btn" data-delete-sched="${s.id}" title="Remove">${icon('x')}</button>
      </div>
    </div>
  </div>`;
      }

      let dragCtx = null;

      /* ---- Desktop HTML5 drag helpers ---- */
      function bindDesktopDrag(view) {
        view.querySelectorAll("[data-drag-module]").forEach(el => {
          el.addEventListener("dragstart", e => {
            dragCtx = { type: "pool", moduleId: el.getAttribute("data-drag-module") };
            e.dataTransfer.effectAllowed = "copy";
          });
        });
        view.querySelectorAll("[data-sched-item]").forEach(el => {
          el.addEventListener("dragstart", e => {
            dragCtx = { type: "item", itemId: el.getAttribute("data-sched-item") };
            el.classList.add("dragging");
            e.dataTransfer.effectAllowed = "move";
          });
          el.addEventListener("dragend", () => { el.classList.remove("dragging"); });
        });
        view.querySelectorAll("[data-day-col]").forEach(col => {
          col.addEventListener("dragover", e => { e.preventDefault(); col.classList.add("drag-over"); });
          col.addEventListener("dragleave", () => { col.classList.remove("drag-over"); });
          col.addEventListener("drop", e => {
            e.preventDefault();
            col.classList.remove("drag-over");
            applyDrop(col.getAttribute("data-day-col"));
          });
        });
      }

      function applyDrop(day) {
        if (!dragCtx) return;
        if (dragCtx.type === "pool") {
          const order = DB.schedule.filter(s => s.day === day).length;
          DB.schedule.push({ id: uid(), moduleId: dragCtx.moduleId, day, startTime: "", endTime: "", order, completed: false });
          persist(); toast("Added to schedule");
        } else if (dragCtx.type === "item") {
          const item = DB.schedule.find(s => s.id === dragCtx.itemId);
          if (item) {
            item.day = day;
            const order = DB.schedule.filter(s => s.day === day && s.id !== item.id).length;
            item.order = order;
            persist();
          }
        }
        dragCtx = null;
        render();
      }

      /* ---- Mobile schedule interactions ----
         Mobile intentionally does NOT reuse desktop's ghost-drag: on a phone the
         primary and most reliable way to move a session is a two-tap flow
         (open the session → "Move to another day"). Swiping the day list
         switches days; tapping a day chip jumps directly. This trades the
         advanced drag gesture for something that never mis-fires on a
         touchscreen. */
      function goToDay(day) { State.scheduleDay = day; render(); }
      function shiftDay(delta) {
        const day = State.scheduleDay || todayKey();
        const i = DAYS.indexOf(day);
        goToDay(DAYS[(i + delta + 7) % 7]);
      }

      function bindMobileScheduleInteractions(view) {
        view.querySelectorAll("[data-mobile-day]").forEach(el => {
          el.addEventListener("click", () => goToDay(el.getAttribute("data-mobile-day")));
        });
        view.querySelectorAll("[data-day-nav]").forEach(el => {
          el.addEventListener("click", () => shiftDay(el.getAttribute("data-day-nav") === "next" ? 1 : -1));
        });
        view.querySelectorAll("[data-open-add-session]").forEach(el => {
          el.addEventListener("click", () => openAddSessionSheet(el.getAttribute("data-open-add-session")));
        });
        view.querySelectorAll("[data-open-quick-actions]").forEach(el => {
          el.addEventListener("click", (e) => {
            if (e.target.closest("[data-toggle-sched]")) return;
            openScheduleQuickActions(el.getAttribute("data-open-quick-actions"));
          });
        });

        const list = document.getElementById("day-session-list");
        if (!list) return;
        let sx = 0, sy = 0, tracking = false;
        list.addEventListener("pointerdown", e => {
          if (e.pointerType === "mouse") return;
          sx = e.clientX; sy = e.clientY; tracking = true;
        }, { passive: true });
        list.addEventListener("pointerup", e => {
          if (!tracking) return;
          tracking = false;
          const dx = e.clientX - sx, dy = e.clientY - sy;
          // Require a clear, mostly-horizontal swipe so normal vertical
          // scrolling of the list is never hijacked.
          if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.3) {
            shiftDay(dx < 0 ? 1 : -1);
          }
        }, { passive: true });
        list.addEventListener("pointercancel", () => { tracking = false; }, { passive: true });
      }

      function initScheduleDnD() {
        const view = document.getElementById("view");
        bindDesktopDrag(view);
        bindMobileScheduleInteractions(view);
      }

      /* ---- Add session (bottom sheet on mobile, modal on desktop) ---- */
      function openAddSessionSheet(day) {

        let selectedDay = DAYS.includes(day) ? day : (State.scheduleDay || todayKey());
        openModal(`

          <label class="field-label">Day</label>
          <div class="day-picker-row" id="as-day-picker">

          </div>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">

          <div class="form-row"><label class="field-label">End</label><input type="time" class="field" id="as-end" value="10:00" style="min-height:44px;"></div>

        <button class="btn btn-primary" id="as-save">Add session</button>
      </div>
    </div>
  `);
        document.querySelectorAll("#as-day-picker [data-as-day]").forEach(btn => {
          btn.addEventListener("click", () => {
            selectedDay = btn.getAttribute("data-as-day");
            document.querySelectorAll("#as-day-picker [data-as-day]").forEach(b => b.classList.toggle("active", b === btn));
          });
        });
        document.getElementById("as-save").addEventListener("click", () => {
          const moduleId = document.getElementById("as-module").value;
          const start = document.getElementById("as-start").value;
          const end = document.getElementById("as-end").value;

          if (start && end && timeToMinutes(end) <= timeToMinutes(start)) {
            err.textContent = "End time must be after start time.";
            err.style.display = "block";
            return;
          }
          const order = DB.schedule.filter(s => s.day === selectedDay).length;
          DB.schedule.push({ id: uid(), moduleId, day: selectedDay, startTime: start || "", endTime: end || "", order, completed: false, createdAt: now() });
          persist();
          State.scheduleDay = selectedDay;
          closeModal();
          render();
          toast("Session added");
        });
      }

    <div class="modal-window">

      function openMoveSessionDialog(id) {
        const s = DB.schedule.find(x => x.id === id);
        if (!s) return;
        let target = s.day;
        openModal(`
    <div class="modal-window">
      <div class="modal-header"><h2>Move to another day</h2><button class="close-x" data-close-modal>${icon('x')}</button></div>
      <div class="modal-body">
        <div class="day-picker-row" id="mv-day-picker">
          ${DAYS.map(d => `<button type="button" data-mv-day="${d}" class="${d === target ? 'active' : ''}">${DAY_SHORT[d]}</button>`).join("")}
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>Cancel</button>
        <button class="btn btn-primary" id="mv-save">Move</button>
      </div>
    </div>
  `);
        document.querySelectorAll("#mv-day-picker [data-mv-day]").forEach(btn => {
          btn.addEventListener("click", () => {
            target = btn.getAttribute("data-mv-day");
            document.querySelectorAll("#mv-day-picker [data-mv-day]").forEach(b => b.classList.toggle("active", b === btn));
          });
        });
        document.getElementById("mv-save").addEventListener("click", () => {
          s.day = target;
          s.order = DB.schedule.filter(x => x.day === target && x.id !== s.id).length;
          persist();
          State.scheduleDay = target;
          closeModal(); render();
          toast(`Moved to ${DAY_LABEL[target]}`);
        });
      }

      function duplicateScheduleSession(id) {
        const s = DB.schedule.find(x => x.id === id);
        if (!s) return;
        const day = todayKey();
        const order = DB.schedule.filter(x => x.day === day).length;
        DB.schedule.push({ id: uid(), moduleId: s.moduleId, day, startTime: s.startTime, endTime: s.endTime, order, completed: false, createdAt: now() });
        persist();
        State.scheduleDay = day;
        render();
        toast("Duplicated to today");
      }

      function deleteScheduleSession(id) {
        const idx = DB.schedule.findIndex(x => x.id === id);
        if (idx === -1) return;
        const [removed] = DB.schedule.splice(idx, 1);
        persist();
        render();
        toastUndo("Session removed", () => {
          DB.schedule.push(removed);
          persist(); render();
        });
      }

      // A toast with an inline Undo action, for destructive operations.
      function toastUndo(msg, onUndo) {
        const root = document.getElementById("toast-root");
        const el = document.createElement("div");
        el.className = "toast";
        el.innerHTML = `<i data-lucide="check-circle-2"></i><span>${esc(msg)}</span><button class="toast-undo">Undo</button>`;
        root.appendChild(el);
        lucide.createIcons({ nodes: [el] });
        let done = false;
        const dismiss = () => {
          if (done) return; done = true;
          el.style.transition = "opacity .2s ease, transform .2s ease";
          el.style.opacity = "0"; el.style.transform = "translateY(6px)";
          setTimeout(() => el.remove(), 200);
        };
        el.querySelector(".toast-undo").addEventListener("click", () => { done = true; el.remove(); onUndo(); });
        setTimeout(dismiss, 5000);
      }

          if (pct !== r.progress) {

      function closeCommandPalette() { document.getElementById("cmdk-root").innerHTML = ""; }

      function cmdkSearch(q) {
        const results = document.getElementById("cmdk-results");

        const notes = query ? DB.notes.filter(n => (n.title || "").toLowerCase().includes(query) || (n.content || "").toLowerCase().includes(query)).slice(0, 6) : [];
        if (cmds.length) {
          html += `<div class="cmdk-group-label">Commands</div>`;
          html += cmds.map((c, i) => `<div class="cmdk-item" data-cmdk-cmd="${i}">${icon(c.icon)}<span>${c.label}</span></div>`).join("");

        if (mods.length) {
          html += `<div class="cmdk-group-label">Modules</div>`;
          html += mods.map(m => `<div class="cmdk-item" data-cmdk-module="${m.id}">${icon(m.icon)}<span>${esc(m.name)}</span><span class="cmdk-sub">${m.status}</span></div>`).join("");

        if (notes.length) {
          html += `<div class="cmdk-group-label">Notes</div>`;
          html += notes.map(n => `<div class="cmdk-item" data-cmdk-note="${n.id}">${icon('notebook-pen')}<span>${esc(n.title || 'Untitled')}</span></div>`).join("");
        }
        if (!html) {
          html = `<div style="padding:24px; text-align:center; color:var(--text-tertiary); font-size:12.5px;">No results found.</div>`;
        }
        results.innerHTML = html;
        renderIcons(results);
        results.querySelectorAll("[data-cmdk-cmd]").forEach(el => el.addEventListener("click", () => {
          const c = cmds[+el.getAttribute("data-cmdk-cmd")];
          closeCommandPalette(); c.action();
        }));
        results.querySelectorAll("[data-cmdk-module]").forEach(el => el.addEventListener("click", () => {
          closeCommandPalette(); navigate("module", { moduleId: el.getAttribute("data-cmdk-module"), moduleTab: "resources" });
        }));
        results.querySelectorAll("[data-cmdk-resource]").forEach(el => el.addEventListener("click", () => {
          closeCommandPalette(); openResourceViewer(el.getAttribute("data-cmdk-resource"));
        }));
        results.querySelectorAll("[data-cmdk-note]").forEach(el => el.addEventListener("click", () => {
          const n = DB.notes.find(x => x.id === el.getAttribute("data-cmdk-note"));
          closeCommandPalette(); if (n) openNoteDialog(n.moduleId, n.id);
        }));
      }
      function cmdkKeyNav(e) { if (e.key === "Escape") closeCommandPalette(); }

      /* ---------------- Theme ---------------- */
      function setTheme(mode) {
        if (!DB) return;
        DB.settings.theme = mode;
        saveSettings(DB.settings);
        applyTheme();
        render();
      }
      function applyTheme() {
        let effective = "dark";
        if (DB && DB.settings) {
          effective = DB.settings.theme;
        }
        if (effective === "system") {
          effective = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.body.setAttribute("data-theme", effective);
      }

      /* ---------------- Event Delegation ---------------- */
      function attachViewHandlers() {
        const view = document.getElementById("view");
        view.querySelectorAll("[data-nav]").forEach(el => el.addEventListener("click", () => navigate(el.getAttribute("data-nav"))));
        view.querySelectorAll("[data-open-module]").forEach(el => el.addEventListener("click", (e) => {
          if (e.target.closest("[data-edit-module],[data-delete-module]")) return;
          navigate("module", { moduleId: el.getAttribute("data-open-module"), moduleTab: "resources" });
        }));
        view.querySelectorAll("[data-edit-module]").forEach(el => el.addEventListener("click", (e) => { e.stopPropagation(); openModuleDialog(el.getAttribute("data-edit-module")); }));
        view.querySelectorAll("[data-delete-module]").forEach(el => el.addEventListener("click", (e) => { e.stopPropagation(); deleteModule(el.getAttribute("data-delete-module")); }));
        view.querySelectorAll("[data-open-module-dialog]").forEach(el => el.addEventListener("click", () => openModuleDialog()));
        view.querySelectorAll("[data-mod-filter]").forEach(el => el.addEventListener("click", () => { State.moduleFilter = el.getAttribute("data-mod-filter"); render(); }));
        view.querySelectorAll("[data-mod-tab]").forEach(el => el.addEventListener("click", () => { State.moduleTab = el.getAttribute("data-mod-tab"); render(); }));
        view.querySelectorAll("[data-open-resource-dialog]").forEach(el => el.addEventListener("click", () => openResourceDialog(el.getAttribute("data-open-resource-dialog"))));
        view.querySelectorAll("[data-open-resource]").forEach(el => el.addEventListener("click", (e) => {
          if (e.target.closest("[data-delete-resource]")) return;
          openResourceViewer(el.getAttribute("data-open-resource"));
        }));
        view.querySelectorAll("[data-delete-resource]").forEach(el => el.addEventListener("click", (e) => { e.stopPropagation(); deleteResource(el.getAttribute("data-delete-resource")); }));
        view.querySelectorAll("[data-res-filter]").forEach(el => el.addEventListener("click", () => { State.resourceFilter = el.getAttribute("data-res-filter"); render(); }));
        view.querySelectorAll("[data-open-note-dialog]").forEach(el => el.addEventListener("click", () => openNoteDialog(el.getAttribute("data-open-note-dialog"))));
        view.querySelectorAll("[data-open-note]").forEach(el => el.addEventListener("click", () => {
          const n = DB.notes.find(x => x.id === el.getAttribute("data-open-note"));
          if (n) openNoteDialog(n.moduleId, n.id);
        }));
        view.querySelectorAll("[data-progress-slider]").forEach(el => {
          el.addEventListener("input", () => {
            setProgress(el.getAttribute("data-progress-slider"), +el.value);
            render();
          });
        });
        view.querySelectorAll("[data-toggle-sched]").forEach(el => el.addEventListener("click", (e) => {
          e.stopPropagation();
          const s = DB.schedule.find(x => x.id === el.getAttribute("data-toggle-sched"));
          if (s) { s.completed = !s.completed; persist(); render(); }
        }));
        view.querySelectorAll("[data-delete-sched]").forEach(el => el.addEventListener("click", (e) => {
          e.stopPropagation();
          deleteScheduleSession(el.getAttribute("data-delete-sched"));
        }));
        view.querySelectorAll("[data-edit-sched]").forEach(el => el.addEventListener("click", (e) => {
          e.stopPropagation(); openScheduleTimeDialog(el.getAttribute("data-edit-sched"));
        }));
        view.querySelectorAll("[data-theme-opt]").forEach(el => el.addEventListener("click", () => setTheme(el.getAttribute("data-theme-opt"))));

        const youtubeKeyBtn = document.getElementById("settings-save-youtube-key");
        if (youtubeKeyBtn) youtubeKeyBtn.addEventListener("click", () => {
          saveYouTubeApiKey(document.getElementById("settings-youtube-api-key")?.value || "");
          toast("YouTube playlist key saved");
        });

        const settingsSyncBtn = document.getElementById("settings-sync-now");
        if (settingsSyncBtn) settingsSyncBtn.addEventListener("click", async () => {
          toast("Syncing with Google Drive…");
          try { await ensureDriveFile(); toast("Synced"); }
          catch (e) { console.error(e); toast("Sync failed", "error"); }
          render();
        });
        const settingsSignoutBtn = document.getElementById("settings-google-signout");
        if (settingsSignoutBtn) settingsSignoutBtn.addEventListener("click", googleSignOut);
      }

      document.addEventListener("click", (e) => {
        const navEl = e.target.closest("[data-nav]");
        if (navEl && (navEl.closest("#sidebar") || navEl.closest("#mobile-nav"))) {
          navigate(navEl.getAttribute("data-nav"));
        }
        const themeEl = e.target.closest("[data-theme-opt]");
        if (themeEl && themeEl.closest("#sidebar")) {
          setTheme(themeEl.getAttribute("data-theme-opt"));
        }
        if (e.target.closest("#search-trigger-btn")) { openCommandPalette(); }
        const gaMenu = document.getElementById("ga-menu");
        if (gaMenu && gaMenu.classList.contains("open") && !e.target.closest("#google-account")) {
          gaMenu.classList.remove("open");
        }
      });

      document.addEventListener("keydown", (e) => {
        const isCmdK = (e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k";
        if (isCmdK) { e.preventDefault(); openCommandPalette(); return; }
        if (e.key === "Escape") {
          if (document.getElementById("cmdk-root").innerHTML) closeCommandPalette();
          else if (document.getElementById("viewer-root").innerHTML) document.getElementById("viewer-root").innerHTML = "";
          else if (document.getElementById("modal-root").innerHTML) closeModal();
        }
      });

      window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
        if (DB && DB.settings && DB.settings.theme === "system") applyTheme();
      });

      window.addEventListener("resize", debounce(() => {
        if (State.route === "schedule") render();
      }, 200));

      /* ---------------- Boot ---------------- */
      applyTheme();
      initGoogle();

    })();
  </script>
</body>

</html>
